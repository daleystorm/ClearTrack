<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClearTrack</title>
<meta name="description" content="Personal debt and spending tracker. Your data stays on this device.">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClearTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one phone column; a coloured summary card on top, compact cards and fold-outs below; fixed tab bar + add button.
   Colour: cool slate neutrals, one theme accent (picked in Setup), a marigold highlight, and a colour per section. */
:root {
  --bg: #f1f3f7; --surface: #ffffff; --surface-2: #e8ebf1; --ink: #141b26; --muted: #5b6474; --line: #d9dee6;
  --accent-ink: #ffffff; --hl: #f2b544; --hero-ink: #ffffff;
  --sec-spend: #d4553a; --sec-plan: #0f8577; --sec-debt: #5b4bd0; --sec-setup: #5b6474; --sec-home: var(--accent);
  --good: #1d7f47; --good-soft: #dbf0e2; --warn: #a8640a; --warn-soft: #f8e7c8; --bad: #b5321c; --bad-soft: #f7ddd7;
  --shadow: 0 1px 2px rgba(20,27,38,.05), 0 6px 18px rgba(20,27,38,.06);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --accent: #1d58a8; --accent-soft: #dfe9f7; --hero1: #14305a; --hero2: #1d58a8;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
:root[data-accent="harbour"] { --accent: #1d58a8; --accent-soft: #dfe9f7; --hero1: #14305a; --hero2: #1d58a8; }
:root[data-accent="seagreen"] { --accent: #0b6a4c; --accent-soft: #d5ebe1; --hero1: #0a3d2e; --hero2: #0b6a4c; }
:root[data-accent="plum"] { --accent: #7b3f9e; --accent-soft: #eedff5; --hero1: #3c1c55; --hero2: #7b3f9e; }
:root[data-accent="graphite"] { --accent: #2f3d52; --accent-soft: #e1e6ee; --hero1: #1b2433; --hero2: #3a4a63; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #0e1218; --surface: #171d26; --surface-2: #212937; --ink: #e6ebf2; --muted: #95a0b2; --line: #2a3342;
  --accent-ink: #0e1218; --hl: #f5c463; --hero-ink: #ffffff;
  --sec-spend: #ff8a6b; --sec-plan: #42c7b5; --sec-debt: #a99bff; --sec-setup: #95a0b2; --sec-home: var(--accent);
  --good: #5ccf8a; --good-soft: #163525; --warn: #f0b04c; --warn-soft: #3a2b12; --bad: #ff8a72; --bad-soft: #3f1d16;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; color-scheme: dark;
  --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
  :root:not([data-theme="light"])[data-accent="harbour"] { --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
  :root:not([data-theme="light"])[data-accent="seagreen"] { --accent: #4fc496; --accent-soft: #15372b; --hero1: #0c2a20; --hero2: #0f5039; }
  :root:not([data-theme="light"])[data-accent="plum"] { --accent: #c99be6; --accent-soft: #2f1d3d; --hero1: #2a1440; --hero2: #5a2d78; }
  :root:not([data-theme="light"])[data-accent="graphite"] { --accent: #a9b8cf; --accent-soft: #222b38; --hero1: #151b25; --hero2: #2b3647; }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #171d26; --surface-2: #212937; --ink: #e6ebf2; --muted: #95a0b2; --line: #2a3342;
  --accent-ink: #0e1218; --hl: #f5c463; --hero-ink: #ffffff;
  --sec-spend: #ff8a6b; --sec-plan: #42c7b5; --sec-debt: #a99bff; --sec-setup: #95a0b2; --sec-home: var(--accent);
  --good: #5ccf8a; --good-soft: #163525; --warn: #f0b04c; --warn-soft: #3a2b12; --bad: #ff8a72; --bad-soft: #3f1d16;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; color-scheme: dark;
  --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
:root[data-theme="dark"][data-accent="harbour"] { --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
:root[data-theme="dark"][data-accent="seagreen"] { --accent: #4fc496; --accent-soft: #15372b; --hero1: #0c2a20; --hero2: #0f5039; }
:root[data-theme="dark"][data-accent="plum"] { --accent: #c99be6; --accent-soft: #2f1d3d; --hero1: #2a1440; --hero2: #5a2d78; }
:root[data-theme="dark"][data-accent="graphite"] { --accent: #a9b8cf; --accent-soft: #222b38; --hero1: #151b25; --hero2: #2b3647; }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 170px }
h1, h2, h3 { margin: 0; text-wrap: balance }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.small { font-size: 13px }
.lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.money { font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 14px }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.02em }
.brand span { color: var(--accent) }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }

/* hero: the coloured summary card that opens each screen */
.hero { position: relative; overflow: hidden; margin-bottom: 14px; padding: 18px 18px 18px; border-radius: 22px; color: var(--hero-ink);
  background: radial-gradient(120% 140% at 100% 0%, var(--hero2) 0%, var(--hero1) 62%); box-shadow: 0 10px 28px rgba(15,25,45,.18) }
.hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; border: 28px solid rgba(255,255,255,.06); pointer-events: none }
.hero .lbl { color: rgba(255,255,255,.78) }
.hero .money { font-size: clamp(34px, 11vw, 52px); line-height: 1.05; margin-top: 6px; overflow-wrap: anywhere }
.hero .cur { font-size: .42em; vertical-align: .6em; margin-right: 4px; color: var(--hl); font-weight: 600 }
.hero p { margin: 8px 0 0; color: rgba(255,255,255,.8); font-size: 14px; position: relative; z-index: 1 }
.hero h1 { color: var(--hero-ink) }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; position: relative; z-index: 1 }
.hero-stats a, .hero-stats div { display: block; text-decoration: none; color: inherit; background: rgba(255,255,255,.1); border-radius: 12px; padding: 9px 10px; min-width: 0 }
.hero-stats span { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.72); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hero-stats b { display: block; font-family: var(--f-display); font-weight: 600; font-size: clamp(12.5px, 3.7vw, 15px); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hero-stats b.hl { color: var(--hl) }
.hero .pill { background: rgba(255,255,255,.16); color: #fff }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stack { display: grid; gap: 12px }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0 }
.card h2 { font-size: 15px; font-weight: 600 }
.card .money.m { font-size: 22px; margin-top: 6px; display: block }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.row > :first-child { min-width: 0 }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap }
.pill.green { background: var(--good-soft); color: var(--good) }
.pill.amber { background: var(--warn-soft); color: var(--warn) }
.pill.red { background: var(--bad-soft); color: var(--bad) }
.pill.plain { background: var(--surface-2); color: var(--muted) }

/* card meter */
.meter { position: relative; height: 14px; border-radius: 999px; background: var(--surface-2); margin: 14px 0 6px; overflow: visible }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .45 }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted) }

.list { list-style: none; margin: 10px 0 0; padding: 0 }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line) }
.list li:first-child { border-top: 0 }
.list .main { min-width: 0 }
.list .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.list .s { font-size: 13px; color: var(--muted) }
.amt { font-weight: 600; white-space: nowrap; text-align: right }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500 }
.banner.info { background: var(--accent-soft); color: var(--accent) }
.banner button { margin-left: auto; background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 }

.insight { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px }
.insight b { color: var(--accent) }
.spark { width: 100%; height: 56px; display: block; margin-top: 12px }

details.calc summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); list-style: none }
details.calc summary::-webkit-details-marker { display: none }
.calc table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px }
.calc td { padding: 6px 0; border-top: 1px solid var(--line) }
.calc td:last-child { text-align: right; white-space: nowrap }
.calc tr.total td { font-weight: 700; border-top: 2px solid var(--ink) }

/* tab bar + fab */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 10px; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 600; min-height: 56px; justify-content: center }
.tabs a[data-tab="home"] { --tc: var(--sec-home) } .tabs a[data-tab="activity"] { --tc: var(--sec-spend) } .tabs a[data-tab="plan"] { --tc: var(--sec-plan) }
.tabs a[data-tab="debts"] { --tc: var(--sec-debt) } .tabs a[data-tab="setup"] { --tc: var(--sec-setup) }
.tabs a[aria-current="page"] { color: var(--tc) }
.tabs svg { width: 22px; height: 22px; padding: 0; border-radius: 999px }
.tabs a[aria-current="page"] svg { background: color-mix(in srgb, var(--tc) 16%, transparent); width: 46px; padding: 0 12px; box-sizing: content-box; margin: 0 -12px }
.fab { position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  width: 64px; height: 64px; border-radius: 22px; border: 0; background: var(--hl); color: #1d1606; box-shadow: 0 8px 22px rgba(15,25,45,.28);
  display: grid; place-items: center }
.fab svg { width: 30px; height: 30px }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 18px) } }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,12,.45); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 18px) }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px }
.sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px }
.amount-in { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border-radius: var(--r); padding: 14px 16px; border: 2px solid transparent }
.amount-in:focus-within { border-color: var(--accent) }
.amount-in span { font-family: var(--f-display); color: var(--muted); font-size: 20px }
.amount-in input { border: 0; background: transparent; outline: none; width: 100%; font-family: var(--f-display); font-size: 34px; font-weight: 600; min-width: 0 }
.field { display: grid; gap: 6px; margin-top: 14px }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none }
.in, select.in, textarea.in { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
textarea.in { min-height: 70px; resize: vertical }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chips button { min-height: 40px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500 }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; font-size: 14px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line) }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent) }
.btn { min-height: 52px; border-radius: 14px; border: 0; padding: 0 18px; font-weight: 700; font-size: 16px }
.btn.primary { background: var(--accent); color: var(--accent-ink); width: 100% }
.btn.ghost { background: transparent; color: var(--muted) }
.btn.danger { background: var(--bad-soft); color: var(--bad) }
.btn:disabled { opacity: .45 }
.actions { display: grid; gap: 8px; margin-top: 18px }
.err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 8px }

/* activity */
.search { display: grid; gap: 8px; margin-bottom: 12px }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.month-h { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 6px }
.month-h h2 { font-size: 15px }
.txn { width: 100%; text-align: left; background: none; border: 0; padding: 0; display: flex; justify-content: space-between; gap: 12px; align-items: center }
.cc { color: var(--warn) }
.inc { color: var(--good) }

/* setup */
details.sec { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow) }
details.sec > summary { list-style: none; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600 }
details.sec > summary::-webkit-details-marker { display: none }
details.sec > summary::after { content: "+"; font-size: 20px; color: var(--muted) }
details.sec[open] > summary::after { content: "–" }
.sec-body { padding: 0 16px 16px }
.sec-body .field:first-child { margin-top: 0 }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; display: grid; gap: 10px }
.item .two, .item .three { gap: 8px }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px }
.item .field { margin-top: 0 }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; text-align: left }
.linkbtn.del { color: var(--bad) }
.savebar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); z-index: 22; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.savebar div { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 8px 8px 8px 16px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25) }
.savebar span { flex: 1; font-weight: 600; font-size: 14px }
.savebar button { min-height: 44px; border-radius: 12px; border: 0; padding: 0 16px; font-weight: 700 }
.savebar .go { background: var(--accent); color: var(--accent-ink) }
.savebar .no { background: transparent; color: var(--bg) }
.hint { font-size: 12.5px; color: var(--muted) }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
.empty { text-align: center; padding: 40px 12px; color: var(--muted) }
.sync { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px }
/* phase 2 */
.navseg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 14px }
.navseg a { min-height: 42px; display: grid; place-items: center; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px }
.navseg a[aria-current="page"] { background: var(--surface); color: var(--sec, var(--ink)); box-shadow: var(--shadow) }
body[data-sec="activity"] { --sec: var(--sec-spend) } body[data-sec="plan"] { --sec: var(--sec-plan) } body[data-sec="debts"] { --sec: var(--sec-debt) } body[data-sec="setup"] { --sec: var(--sec-setup) } body[data-sec="home"] { --sec: var(--accent) }
.ghead h2, .month-h h2 { color: var(--sec, var(--ink)) }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1 }
.stepper h1 { font-family: var(--f-display); font-size: 20px; font-weight: 600 }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 12px }
.kv div { min-width: 0 }
.kv b { display: block; font-weight: 600; font-size: 15px; margin-top: 2px }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent) }
.bar span.over { background: var(--bad) }
.prow { padding: 11px 0; border-top: 1px solid var(--line); display: grid; gap: 4px }
.prow:first-child { border-top: 0 }
.prow .row .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

<script>
/* ClearTrack calculation engine — rules R1–R19 from the App Spec sheet.
   Pure functions; full precision; rounding only at display.
   Dates are ISO strings 'YYYY-MM-DD' handled in UTC. */
(function (root) {
  'use strict';

  // ---------- date helpers ----------
  const DAY = 86400000;
  function D(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); }
  function iso(t) { return new Date(t).toISOString().slice(0, 10); }
  function ymd(iso_) { const [y, m, d] = iso_.split('-').map(Number); return { y, m, d }; }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); } // m = 1..12
  function mk(y, m, d) { // normalises month overflow, d capped later by caller
    const t = new Date(Date.UTC(y, m - 1, 1)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d };
  }
  function dateCapped(y, m, day) { const n = mk(y, m, 1); return iso(Date.UTC(n.y, n.m - 1, Math.min(day, daysInMonth(n.y, n.m)))); }
  function backToFriday(isoDate) { // WORKDAY(date+1,-1): weekend → Friday before
    const t = D(isoDate); const wd = new Date(t).getUTCDay();
    if (wd === 6) return iso(t - DAY); if (wd === 0) return iso(t - 2 * DAY); return isoDate;
  }
  function edate(isoDate, n) { // Excel EDATE: same day, capped at month length
    const { y, m, d } = ymd(isoDate); return dateCapped(y, m + n, d);
  }
  function monthStart(isoDate) { return isoDate.slice(0, 8) + '01'; }
  function monthKey(isoDate) { return isoDate.slice(0, 4) + isoDate.slice(5, 7); }
  function addDays(isoDate, n) { return iso(D(isoDate) + n * DAY); }
  function monthsBetween(a, b) { const A = ymd(a), B = ymd(b); return (B.y - A.y) * 12 + B.m - A.m; }

  const PERIODS = { 'Monthly': 1, 'Semi-Monthly': 2, 'Biweekly': 26 / 12, 'Weekly': 52 / 12 };
  function periodsPerMonth(s) { return PERIODS[s.payFrequency] || 1; }

  // ---------- R1 next payday ----------
  function payDateInMonth(y, m, usualDay) { return backToFriday(dateCapped(y, m, usualDay)); }
  function nextPayday(s, today) {
    const { y, m } = ymd(today);
    const p = payDateInMonth(y, m, s.usualPayday);
    return p >= today ? p : payDateInMonth(y, m + 1, s.usualPayday);
  }
  function paydayAfterNext(s, today) {
    const b5 = nextPayday(s, today); const { y, m, d } = ymd(b5);
    switch (s.payFrequency) {
      case 'Weekly': return addDays(b5, 7);
      case 'Biweekly': return addDays(b5, 14);
      case 'Semi-Monthly': return d <= 15 ? dateCapped(y, m, 31) : dateCapped(y, m + 1, 15);
      default: return payDateInMonth(y, m + 1, s.usualPayday);
    }
  }
  function lastPayday(s, today) { // Payday Checklist B5 inner date
    const b5 = nextPayday(s, today);
    if (s.payFrequency === 'Monthly' || !s.payFrequency) { const { y, m } = ymd(b5); return payDateInMonth(y, m - 1, s.usualPayday); }
    return iso(2 * D(b5) - D(paydayAfterNext(s, today)));
  }

  // ---------- categories ----------
  function paymentCat(debt) { return debt.name + ' Payment'; }
  function interestCat(debt) { return debt.isRevolving ? 'Card Interest' : debt.name + ' Interest'; }
  function cardDebt(state) { return state.debts.find(d => d.isRevolving) || null; }

  // ---------- R2 flow type ----------
  function flowType(t, state) {
    const c = t.category;
    if (c === 'Net Pay') return 'Income';
    if (c === 'Extra Credit Card Payment' || state.debts.some(d => paymentCat(d) === c)) return 'Debt Payment';
    if (c === 'Outside Savings') return 'Savings';
    if (state.debts.some(d => interestCat(d) === c)) return 'Interest';
    return 'Expense';
  }
  const CASHLIKE = m => m === 'Debit/Cash' || m === 'Bank Transfer';

  // ---------- R3 live cash ----------
  function liveCash(state) {
    const s = state.settings;
    let out = 0;
    for (const t of state.transactions) {
      if (!t.date || !CASHLIKE(t.paymentMethod)) continue;
      if (flowType(t, state) === 'Income') continue;
      if (t.date >= s.cashAsOfDate) out += +t.amount;
    }
    return Math.max(s.cashOnHand - out, 0);
  }

  // ---------- R4 card impact / live balances ----------
  function cardImpact(t, state) {
    const card = cardDebt(state); if (!card || !t.date || t.date <= card.balanceAsOf) return 0;
    if (t.paymentMethod === 'Credit Card') return +t.amount;
    if (t.category === paymentCat(card) || t.category === 'Extra Credit Card Payment') return -t.amount;
    if (t.category === interestCat(card)) return +t.amount; // interest posted by another method
    return 0;
  }
  function liveBalance(debt, state) {
    if (debt.isRevolving) {
      let b = +debt.balance; for (const t of state.transactions) b += cardImpact(t, state); return b;
    }
    let paid = 0, interest = 0;
    for (const t of state.transactions) {
      if (!t.date || t.date <= debt.balanceAsOf) continue;
      if (t.category === paymentCat(debt)) paid += +t.amount;
      if (t.category === interestCat(debt)) interest += +t.amount;
    }
    return Math.max(+debt.balance + interest - paid, 0);
  }

  // ---------- R5–R11 payday waterfall ----------
  function netPayReceived(s, today) { return s.cashAsOfDate < lastPayday(s, today) ? +s.netPayPerPeriod : 0; }
  function cycleStart(s) { const a = s.cashAsOfDate, b = s.planningMonth; return a > b ? a : b; }
  function budgetStillToSpend(state) { // R7
    const s = state.settings, per = periodsPerMonth(s), from = cycleStart(s);
    let total = 0;
    for (const c of state.categories) {
      const bud = (+c.monthlyBudget || 0) / per;
      let paid = 0;
      for (const t of state.transactions) {
        if (t.category === c.name && t.date >= from && CASHLIKE(t.paymentMethod) && flowType(t, state) === 'Expense') paid += +t.amount;
      }
      total += Math.max(bud - paid, 0);
    }
    return Math.max(total, 0);
  }
  function takeHomeDebtStillDue(state) { // R8
    const s = state.settings, per = periodsPerMonth(s), from = cycleStart(s);
    let total = 0;
    for (const d of state.debts) {
      if (d.paymentSource !== 'Take-home') continue;
      const req = (+d.requiredPayment || 0) / per;
      let paid = 0;
      for (const t of state.transactions) {
        if (t.category === paymentCat(d) && t.date >= from && CASHLIKE(t.paymentMethod)) paid += +t.amount;
      }
      total += paid > req ? 0 : req - paid;
    }
    return total;
  }
  function billsBeforePayday(state, today) { // R9
    const np = nextPayday(state.settings, today);
    return state.bills.filter(b => !b.paid && b.dueDate && b.dueDate <= np).reduce((a, b) => a + +b.amount, 0);
  }

  // ---------- R13 card status ----------
  function cardStatus(balance, s) {
    const hard = +s.cardHardCeiling, soft = +s.cardSoftCeiling;
    let status = 'WITHIN LIMIT';
    if (balance >= hard) status = 'HARD LIMIT REACHED';
    else if (balance >= hard * s.criticalPct) status = 'CRITICAL';
    else if (balance >= soft) status = 'CAUTION';
    else if (balance >= hard * s.watchPct) status = 'WATCH';
    const level = { 'HARD LIMIT REACHED': 'red', 'CRITICAL': 'red', 'CAUTION': 'amber', 'WATCH': 'amber', 'WITHIN LIMIT': 'green' }[status];
    return { status, level, used: hard ? balance / hard : 0, room: Math.max(hard - balance, 0) };
  }

  // ---------- R14–R16 debts ----------
  function priorities(state, balances) {
    const method = state.settings.payoffMethod;
    const idx = state.debts.map((d, i) => i);
    idx.sort((a, b) => {
      const A = state.debts[a], B = state.debts[b];
      const diff = method === 'Snowball' ? balances[a] - balances[b] : B.apr - A.apr;
      return diff !== 0 ? diff : a - b;
    });
    const rank = []; idx.forEach((i, r) => rank[i] = r + 1); return rank;
  }
  function nextDueDate(dueDay, today) { // R15
    if (!dueDay) return null; const { y, m } = ymd(today);
    const p = dateCapped(y, m, dueDay); return p >= today ? p : dateCapped(y, m + 1, dueDay);
  }

  // ---------- R17 payoff projection ----------
  function projectPayoff(state, balances, extra, maxMonths = 96) {
    const debts = state.debts, n = debts.length;
    const rank = priorities(state, balances);
    const req = debts.map(d => +d.requiredPayment || 0);
    let bal = balances.slice(); let cum = 0;
    const start = state.settings.planningMonth;
    const rows = [{ month: 0, date: start, balances: bal.slice(), total: bal.reduce((a, b) => a + b, 0), cumInterest: 0 }];
    let found = rows[0].total <= 0 ? rows[0] : null;
    for (let m = 1; m <= maxMonths && !found; m++) {
      const pool = extra + bal.reduce((a, b, i) => a + (b <= 0 ? req[i] : 0), 0);
      const after = [], interest = [];
      for (let i = 0; i < n; i++) {
        const b = bal[i]; const int = b <= 0 ? 0 : b * debts[i].apr / 12;
        const r = b <= 0 ? 0 : Math.min(req[i], b + int);
        interest[i] = int; after[i] = Math.max(b + int - r, 0);
      }
      const next = [];
      for (let i = 0; i < n; i++) {
        let ahead = 0; for (let j = 0; j < n; j++) if (rank[j] < rank[i]) ahead += after[j];
        const applied = Math.min(after[i], Math.max(0, pool - ahead));
        next[i] = Math.max(after[i] - applied, 0);
      }
      bal = next; cum += interest.reduce((a, b) => a + b, 0);
      const row = { month: m, date: edate(start, m), balances: bal.slice(), total: bal.reduce((a, b) => a + b, 0), cumInterest: cum };
      rows.push(row); if (row.total <= 0) found = row;
    }
    const last = rows[rows.length - 1];
    return { debtFree: !!found, months: found ? found.month : null, date: found ? found.date : null,
      totalInterest: found ? found.cumInterest : last.cumInterest, rows };
  }

  // ---------- R19 loan progress ----------
  function pmt(r, n, pv) { return r === 0 ? pv / n : pv * r / (1 - Math.pow(1 + r, -n)); }
  function pv(r, n, p) { return r === 0 ? p * n : p * (1 - Math.pow(1 + r, -n)) / r; }
  function nper(r, p, b) { if (r === 0) return b / p; const x = 1 - b * r / p; return x <= 0 ? Infinity : -Math.log(x) / Math.log(1 + r); }
  function loanProgress(debt, balance, today) {
    if (debt.isRevolving || !debt.startDate || !debt.endDate || !debt.originalAmount) return null;
    const term = monthsBetween(debt.startDate, debt.endDate), r = debt.apr / 12;
    const elapsed = Math.max(monthsBetween(debt.startDate, today), 0);
    const sched = pmt(r, term, +debt.originalAmount);
    const schedBal = Math.max(pv(r, Math.max(term - elapsed, 0), sched), 0);
    const ahead = schedBal - balance, half = (+debt.requiredPayment) / 2;
    const n = nper(r, +debt.requiredPayment, balance);
    return { term, monthsElapsed: elapsed, pctTerm: Math.min(elapsed / term, 1), pctPaid: (debt.originalAmount - balance) / debt.originalAmount,
      scheduledPayment: sched, scheduledBalance: schedBal, ahead,
      pace: ahead > half ? 'AHEAD' : ahead < -half ? 'BEHIND' : 'ON TRACK',
      projectedPayoff: isFinite(n) ? edate(today, Math.ceil(n)) : null,
      termsCheck: Math.abs(sched - debt.requiredPayment) / debt.requiredPayment > 0.05 ? 'CHECK TERMS' : 'OK' };
  }

  // ---------- everything at once ----------
  function compute(state, today) {
    const s = state.settings, per = periodsPerMonth(s);
    const r1 = nextPayday(s, today), r1b = paydayAfterNext(s, today);
    const cash = liveCash(state);
    const r5 = netPayReceived(s, today);
    const r6 = r5 + (+s.otherIncome || 0) + cash;
    const r7 = budgetStillToSpend(state), r8 = takeHomeDebtStillDue(state), r9 = billsBeforePayday(state, today);
    const savings = (+s.monthlyOutsideSavings || 0) / per, buffer = +s.cashBufferTarget || 0;
    const r10 = Math.max(r6 - (r7 + r8 + r9 + savings) - buffer, 0);
    const r11 = Math.max(r6 - (r8 + r9 + savings + buffer), 0);
    const monthlyNet = Math.round(s.netPayPerPeriod * per * 100) / 100;
    const budgetTotal = state.categories.reduce((a, c) => a + (+c.monthlyBudget || 0), 0);
    const plannedDebt = state.debts.filter(d => d.paymentSource === 'Take-home').reduce((a, d) => a + (+d.requiredPayment || 0), 0);
    const r12 = monthlyNet - (budgetTotal + plannedDebt + (+s.monthlyOutsideSavings || 0));
    const balances = state.debts.map(d => liveBalance(d, state));
    const card = cardDebt(state); const cardBal = card ? balances[state.debts.indexOf(card)] : 0;
    const r13 = cardStatus(cardBal, s);
    const rank = priorities(state, balances), maxRank = state.debts.length;
    const debts = state.debts.map((d, i) => ({ ...d, liveBalance: balances[i], priority: rank[i],
      action: rank[i] === 1 ? 'ATTACK FIRST' : rank[i] === maxRank ? 'MAINTAIN' : 'NEXT',
      nextDue: nextDueDate(d.dueDay, today), estInterest: balances[i] * d.apr / 12,
      progress: loanProgress(d, balances[i], today) }));
    const extra = +s.monthlyExtraPayment || 0;
    const r17 = projectPayoff(state, balances, extra);
    const r18base = projectPayoff(state, balances, extra + 10000);
    const r18 = { step: 10000, monthsSaved: (r17.months != null && r18base.months != null) ? r17.months - r18base.months : null,
      interestSaved: r17.totalInterest - r18base.totalInterest, alt: r18base };
    const uncategorised = state.transactions.filter(t => !t.category);
    return { today, nextPayday: r1, paydayAfterNext: r1b, lastPayday: lastPayday(s, today), periodsPerMonth: per,
      cash, netPayReceived: r5, otherIncome: +s.otherIncome || 0, totalAvailable: r6, budgetStillToSpend: r7, takeHomeDebtDue: r8,
      billsBeforePayday: r9, savingsThisCycle: savings, cashBuffer: buffer, safeExtra: r10, safeToSpend: r11,
      plannedCushion: r12, monthlyNet, budgetTotal, plannedDebt,
      card: card ? { name: card.name, balance: cardBal, ...r13, hard: +s.cardHardCeiling, soft: +s.cardSoftCeiling } : null,
      debts, totalDebt: balances.reduce((a, b) => a + b, 0), payoff: r17, insight: r18,
      uncategorised: uncategorised.length, uncategorisedAmount: uncategorised.reduce((a, t) => a + +t.amount, 0) };
  }

  // ---------- S4 Monthly Plan (workbook Monthly Plan sheet) ----------
  function actualFor(state, category, mk) {
    let a = 0; for (const t of state.transactions) if (t.date && t.category === category && monthKey(t.date) === mk) a += +t.amount; return a;
  }
  function spendStatus(budget, actual) { return actual === 0 ? 'Not started' : actual <= budget ? 'On plan' : 'Over'; }
  function monthlyPlan(state, monthIso, calc) {
    const s = state.settings, mk = monthKey(monthIso), per = periodsPerMonth(s);
    const monthlyNet = Math.round(s.netPayPerPeriod * per * 100) / 100;
    const netActual = actualFor(state, 'Net Pay', mk);
    const income = { name: 'Net Pay', group: 'Income', budget: monthlyNet, actual: netActual, remaining: netActual === 0 ? 0 : netActual - monthlyNet,
      status: netActual === 0 ? 'Waiting for payday' : netActual >= monthlyNet ? 'On plan' : 'Below plan' };
    const groupOf = t => (t === 'Subscription' || t === 'Utility') ? 'Living' : (t || 'Other');
    const spending = state.categories.map(c => {
      const budget = +c.monthlyBudget || 0, actual = actualFor(state, c.name, mk);
      const interest = state.debts.some(d => interestCat(d) === c.name);
      return { name: c.name, group: groupOf(c.type), budget, actual, remaining: budget - actual,
        status: interest ? (actual === 0 ? 'Nothing posted' : 'Posted') : spendStatus(budget, actual), interest };
    });
    const catNames = new Set(state.categories.map(c => c.name));
    const debtRows = state.debts.filter(d => !catNames.has(paymentCat(d))).map(d => {
      const budget = +d.requiredPayment || 0, actual = actualFor(state, paymentCat(d), mk);
      return { name: paymentCat(d), group: d.paymentSource === 'Payroll' ? 'Debt (payroll)' : 'Debt', budget, actual, remaining: budget - actual, status: spendStatus(budget, actual) };
    });
    const extraBudget = calc ? calc.safeExtra : 0, extraActual = actualFor(state, 'Extra Credit Card Payment', mk);
    debtRows.push({ name: 'Extra Credit Card Payment', group: 'Debt', budget: extraBudget, actual: extraActual, remaining: extraBudget - extraActual, status: spendStatus(extraBudget, extraActual) });
    const savBudget = +s.monthlyOutsideSavings || 0, savActual = actualFor(state, 'Outside Savings', mk);
    const savings = { name: 'Outside Savings', group: 'Savings', budget: savBudget, actual: savActual, remaining: savBudget - savActual, status: spendStatus(savBudget, savActual) };
    const interestRows = state.debts.filter(d => !catNames.has(interestCat(d))).map(d => {
      const actual = actualFor(state, interestCat(d), mk);
      return { name: interestCat(d), group: 'Interest (non-cash)', budget: 0, actual, remaining: -actual, status: actual === 0 ? 'Nothing posted' : 'Posted' };
    });
    const livingTotal = spending.reduce((a, r) => a + r.budget, 0);                       // C94
    const plannedDebt = debtRows.filter(r => r.group === 'Debt').reduce((a, r) => a + r.budget, 0); // C95
    const cushion = monthlyNet - (livingTotal + (plannedDebt - extraBudget) + savBudget); // C97
    return { month: monthIso, income, spending, debts: debtRows, savings, interest: interestRows,
      totals: { monthlyNet, livingTotal, plannedDebt, plannedSavings: savBudget, cushion,
        spentLiving: spending.filter(r => !r.interest).reduce((a, r) => a + r.actual, 0) } };
  }

  // ---------- R20 month comparison (workbook Month History) ----------
  function monthFlows(state, mk) {
    const f = { 'Income': 0, 'Total Spend': 0, 'Essential': 0, 'Non-Essential': 0, 'Debt Payments': 0, 'Savings': 0, 'Interest Posted': 0 };
    for (const t of state.transactions) {
      if (!t.date || monthKey(t.date) !== mk) continue;
      const ft = flowType(t, state), a = +t.amount;
      if (ft === 'Income') f['Income'] += a;
      else if (ft === 'Expense') { f['Total Spend'] += a; if (t.essential) f['Essential'] += a; }
      else if (ft === 'Debt Payment') f['Debt Payments'] += a;
      else if (ft === 'Savings') f['Savings'] += a;
      else if (ft === 'Interest') f['Interest Posted'] += a;
    }
    f['Non-Essential'] = f['Total Spend'] - f['Essential'];
    return f;
  }
  const BETTER = { 'Income': 'up', 'Total Spend': 'down', 'Essential': null, 'Non-Essential': 'down', 'Debt Payments': 'up', 'Savings': 'up', 'Interest Posted': 'down' };
  function compareMonths(state, monthIso) {
    const cur = monthFlows(state, monthKey(monthIso)), prevIso = edate(monthIso, -1), prev = monthFlows(state, monthKey(prevIso));
    const prevSum = Object.values(prev).reduce((a, b) => a + b, 0);
    const notLogged = cur['Total Spend'] + cur['Debt Payments'] === 0;
    const rows = Object.keys(cur).map(k => {
      const change = cur[k] - prev[k];
      let direction = prevSum === 0 ? 'no prior data' : (k !== 'Income' && notLogged) ? 'not logged yet' : Math.round(change) === 0 ? 'flat' : change > 0 ? 'up' : 'down';
      const good = BETTER[k] && (direction === 'up' || direction === 'down') ? direction === BETTER[k] : null;
      return { metric: k, current: cur[k], previous: prev[k], change, direction, good };
    });
    return { month: monthIso, previousMonth: prevIso, rows, status: prevSum === 0 ? 'no prior data' : notLogged ? 'not logged yet' : 'ok' };
  }

  // ---------- Payoff Sensitivity ----------
  function sensitivity(state, balances, extra, step = 10000) {
    const sc = [['Base less ' + (2 * step).toLocaleString('en-US'), -2], ['Base less ' + step.toLocaleString('en-US'), -1], ['Your plan', 0],
      ['Base plus ' + step.toLocaleString('en-US'), 1], ['Base plus ' + (2 * step).toLocaleString('en-US'), 2]];
    const base = projectPayoff(state, balances, extra);
    return sc.map(([label, k]) => {
      const x = Math.max(extra + k * step, 0), p = k === 0 ? base : projectPayoff(state, balances, x);
      return { label, extra: x, months: p.months, date: p.date, totalInterest: p.totalInterest,
        interestVsBase: p.totalInterest - base.totalInterest, monthsVsBase: (p.months != null && base.months != null) ? p.months - base.months : null };
    });
  }

  // ---------- R21 statement import (workbook Statement Import + Merchant Rules) ----------
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  function validDate(y, m, d) { if (!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= daysInMonth(y, m))) return null; return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
  function parseStatementDate(raw, dayFirst = true) {
    if (raw == null) return null; let s = String(raw).trim(); if (!s) return null;
    if (/^\d{5}(\.\d+)?$/.test(s)) { const t = Date.UTC(1899, 11, 30) + Math.floor(+s) * DAY; return iso(t); } // Excel serial
    if (s.includes(',') && /^[A-Za-z]{3,}/.test(s)) s = s.slice(s.indexOf(',') + 1).trim();          // "Thu, 02 Oct 2026"
    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if (m) return validDate(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
    if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return dayFirst ? validDate(y, +m[2], +m[1]) : validDate(y, +m[1], +m[2]); }
    m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3,})\.?[\s,-]+(\d{2,4})/);                                  // 02 Oct 2026
    if (m) { const mo = MONTHS[m[2].slice(0, 3).toLowerCase()]; if (mo) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return validDate(y, mo, +m[1]); } }
    m = s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);                                       // Oct 2, 2026
    if (m && MONTHS[m[1].slice(0, 3).toLowerCase()]) return validDate(+m[3], MONTHS[m[1].slice(0, 3).toLowerCase()], +m[2]);
    return null;
  }
  function parseAmount(raw) {
    if (raw == null) return null; if (typeof raw === 'number') return raw;
    let s = String(raw).toUpperCase().replace(/JMD|J\$|\$|,|\s/g, '');
    if (!s) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/CR$/.test(s)) { neg = true; s = s.slice(0, -2); }
    if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
    if (!/^[-+]?\d*\.?\d+$/.test(s)) return null;
    const n = parseFloat(s); return neg ? -Math.abs(n) : n;
  }
  function matchRule(rules, desc) {
    const d = String(desc || '').toLowerCase();
    for (const r of rules || []) if (r.keyword && d.includes(String(r.keyword).toLowerCase())) return r.category;
    return '';
  }
  function importPreview(state, rows, opts = {}) {
    const method = opts.method || 'Credit Card', dayFirst = opts.dayFirst !== false;
    const card = cardDebt(state);
    const seen = new Set(state.transactions.map(t => t.date + '|' + Math.round(+t.amount * 100)));
    return rows.map((r, i) => {
      const date = parseStatementDate(r.date, dayFirst), signed = parseAmount(r.amount);
      const description = String(r.description || '').trim();
      const amount = signed == null ? null : Math.abs(signed);
      const isCredit = signed != null && signed < 0 && method === 'Credit Card'; // workbook rule is for card statements
      const suggested = matchRule(state.merchantRules, description);
      const category = r.category ? r.category : (isCredit && card ? paymentCat(card) : suggested);
      const paymentMethod = isCredit ? 'Bank Transfer' : method;
      const cat = state.categories.find(c => c.name === category);
      const essential = cat ? !!cat.essential : !!category;
      let status;
      if (!date || amount == null) status = 'Fix date / amount';
      else if (seen.has(date + '|' + Math.round(amount * 100))) status = 'Already logged';
      else if (!category) status = 'Pick a category';
      else status = 'Ready';
      return { index: i, raw: r, date, description, amount, signed, category, suggested, paymentMethod, essential,
        notes: 'Imported from statement', status, matched: !!suggested && !r.category && !isCredit };
    });
  }
  function splitDelimited(text) {
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim() !== '');
    if (!lines.length) return [];
    const delim = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
    return lines.map(line => {
      if (delim === '\t') return line.split('\t').map(x => x.trim());
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
        else if (ch === '"') q = true; else if (ch === delim) { out.push(cur.trim()); cur = ''; } else cur += ch;
      }
      out.push(cur.trim()); return out;
    });
  }

  // ---------- reminders (Phase 3) ----------
  function reminders(state, today, calc, horizonDays = 7) {
    const s = state.settings, out = [], horizon = addDays(today, horizonDays);
    const np = calc.nextPayday, dPay = Math.round((D(np) - D(today)) / DAY);
    out.push({ kind: 'payday', date: np, days: dPay, title: dPay === 0 ? 'Payday today' : 'Payday', detail: 'Open the payday breakdown before sending any extra payment.' });
    const from = (s.cashAsOfDate > s.planningMonth ? s.cashAsOfDate : s.planningMonth), per = periodsPerMonth(s);
    for (const d of calc.debts) {
      if (!d.nextDue || d.nextDue > horizon || d.liveBalance <= 0) continue;
      let paid = 0;
      for (const t of state.transactions) if (t.category === paymentCat(d) && t.date >= from) paid += +t.amount;
      const due = (+d.requiredPayment || 0) / per;
      out.push({ kind: 'due', date: d.nextDue, days: Math.round((D(d.nextDue) - D(today)) / DAY), title: d.name + ' payment',
        amount: +d.requiredPayment || 0, payroll: d.paymentSource === 'Payroll', covered: d.paymentSource === 'Payroll' || paid >= due - 0.005, paid });
    }
    for (const b of state.bills) {
      if (b.paid || !b.dueDate) continue;
      if (b.dueDate > np && b.dueDate > horizon) continue;
      out.push({ kind: 'bill', id: b.id, date: b.dueDate, days: Math.round((D(b.dueDate) - D(today)) / DAY), title: b.name, amount: +b.amount, overdue: b.dueDate < today });
    }
    const snapMonth = snapshotDue(state, today);
    if (snapMonth) out.push({ kind: 'snapshot', date: today, days: 0, month: snapMonth, title: 'Record month-end balances', detail: 'for ' + snapMonth.slice(0, 7) });
    return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  }

  // ---------- R22–R25 savings (workbook Savings tab) ----------
  function payrollSavingsAmount(p, state) {
    // A payroll deduction counts as savings when its kind is Savings, or when part of it is a loan payment
    // (lessDebtId): the rest goes to savings, e.g. a credit union deduction less the loan payment = shares.
    if (p.lessDebtId) { const d = state.debts.find(x => x.id === p.lessDebtId); return Math.max((+p.monthlyAmount || 0) - (d ? +d.requiredPayment || 0 : 0), 0); }
    return String(p.category).toLowerCase() === 'savings' ? (+p.monthlyAmount || 0) : 0;
  }
  function goalNeededPerMonth(stillNeeded, targetDate, today) {
    if (!targetDate || stillNeeded === 0) return null;
    return stillNeeded / Math.max(1, monthsBetween(today, targetDate));
  }
  function savings(state, today, calc) {
    const s = state.settings, accts = state.savingsAccounts || [];
    const total = accts.reduce((a, x) => a + (+x.balance || 0), 0);                                   // R22
    const accessible = accts.filter(x => x.accessible).reduce((a, x) => a + (+x.balance || 0), 0);
    // R23 monthly flow
    const flow = [];
    for (const p of state.payrollDeductions || []) { const amt = payrollSavingsAmount(p, state); if (amt > 0) flow.push({ name: p.name, amount: amt, from: 'Payroll', to: p.savesTo || '', payroll: true }); }
    const em = accts.find(x => x.id === s.emergencyAccountId) || accts.find(x => x.accessible) || null;
    if (+s.monthlyOutsideSavings) flow.push({ name: 'Outside savings', amount: +s.monthlyOutsideSavings, from: 'Take-home', to: em ? em.name : '' });
    for (const c of state.categories) if (c.type === 'Sinking Fund' && +c.monthlyBudget) flow.push({ name: c.name, amount: +c.monthlyBudget, from: 'Take-home', to: c.notes && c.notes.startsWith('→') ? c.notes.slice(1).trim() : '' });
    const monthlySaved = flow.reduce((a, f) => a + f.amount, 0);
    const payrollSaved = flow.filter(f => f.payroll).reduce((a, f) => a + f.amount, 0);
    const savingsRate = (+s.netPayPerPeriod + payrollSaved) ? monthlySaved / (+s.netPayPerPeriod + payrollSaved) : 0;
    // R24 goals
    const goals = (state.savingsGoals || []).map(g => {
      let target = +g.target || 0, targetDate = g.targetDate || null, saved = +g.savedSoFar || 0, planned = +g.plannedPerMonth || 0;
      if (g.targetFrom === 'emergency') target = +s.emergencyFundTarget || 0;
      if (g.targetFrom && g.targetFrom.startsWith('bill:')) { const b = state.bills.find(x => x.id === g.targetFrom.slice(5)); if (b) { target = +b.amount || 0; targetDate = b.dueDate ? edate(b.dueDate, 12) : null; } }
      if (g.savedFrom === 'accessible') saved = accessible;
      if (g.plannedFrom === 'outside') planned = +s.monthlyOutsideSavings || 0;
      if (g.plannedFrom && g.plannedFrom.startsWith('category:')) { const c = state.categories.find(x => x.name === g.plannedFrom.slice(9)); planned = c ? +c.monthlyBudget || 0 : 0; }
      const still = Math.max(target - saved, 0);
      const need = goalNeededPerMonth(still, targetDate, today);
      const projected = still === 0 || planned <= 0 ? null : edate(today, Math.ceil(still / planned));
      const status = still === 0 ? 'Reached' : planned <= 0 ? 'Not funded' : !targetDate ? 'No deadline' : planned >= need * 1.25 ? 'Over-funding' : planned >= need ? 'On track' : 'Behind';
      return { ...g, target, targetDate, saved, planned, stillNeeded: still, neededPerMonth: need, projectedDate: projected, status, progress: target ? Math.min(saved / target, 1) : 0 };
    });
    // R25 emergency cover & save-or-pay
    const essentialBudget = state.categories.filter(c => c.essential && c.type !== 'Sinking Fund').reduce((a, c) => a + (+c.monthlyBudget || 0), 0);
    const takeHomeDebt = state.debts.filter(d => d.paymentSource === 'Take-home').reduce((a, d) => a + (+d.requiredPayment || 0), 0);
    const outgo = essentialBudget + takeHomeDebt;
    const monthsCovered = outgo ? accessible / outgo : 0;
    const minMonths = s.minCoverMonths != null ? +s.minCoverMonths : 1;
    const coverStatus = monthsCovered >= 6 ? 'Strong (6+ months)' : monthsCovered >= 3 ? 'Adequate (3-6 months)' : monthsCovered >= minMonths ? 'Thin' : 'Below minimum';
    const top = state.debts.reduce((best, d) => (!best || d.apr > best.apr) ? d : best, null);
    const shortfall = Math.max(minMonths * outgo - accessible, 0);
    const safeExtra = calc ? calc.safeExtra : 0;
    const toSavings = Math.min(shortfall, safeExtra), toDebt = safeExtra - toSavings;
    const fmt = n => Math.round(n).toLocaleString('en-US');
    const emName = em ? em.name : 'savings';
    const recommendation = safeExtra === 0 ? 'No Safe Extra Payment this cycle - keep the planned savings and minimum payments.'
      : toSavings === 0 ? `Savings cover is at your minimum: put the full ${fmt(safeExtra)} Safe Extra Payment on ${top ? top.name : 'your highest-rate debt'}.`
      : `Move ${fmt(toSavings)} to ${emName} to reach ${minMonths} month(s) of cover, and put ${fmt(toDebt)} on ${top ? top.name : 'your highest-rate debt'}.`;
    return { accounts: accts, total, accessible, flow, monthlySaved, savingsRate, goals,
      cover: { essentialBudget, takeHomeDebt, outgo, monthsCovered, minMonths, status: coverStatus },
      saveOrPay: { topDebt: top ? top.name : null, topApr: top ? top.apr : 0, interestIfOutsideToCard: (+s.monthlyOutsideSavings || 0) * (top ? top.apr : 0),
        shortfall, safeExtra, toSavings, toDebt, emergencyAccount: emName, recommendation } };
  }

  // ---------- S7 payday checklist & S10 weekly check-in ----------
  function weekOfMonth(isoDate) { // WEEKNUM(date) - WEEKNUM(first of month) + 1, weeks starting Sunday
    const { y, m, d } = ymd(isoDate); const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    return Math.floor((d - 1 + firstDow) / 7) + 1;
  }
  function cyclePayday(state, today) { const np = nextPayday(state.settings, today); return np === today ? today : lastPayday(state.settings, today); }
  function paydaySteps(state) {
    const s = state.settings, card = cardDebt(state), sym = s.currencySymbol || 'J$';
    const steps = [
      { key: 'salary', label: 'Salary received', why: 'Use actual net pay, not an estimate' },
      { key: 'bills', label: 'Next month bills funded', why: 'Protect essentials before extra debt' }];
    if (card) steps.push({ key: 'card-min', label: 'Credit card minimum protected', why: 'Keep the card minimum covered first' });
    for (const d of state.debts) if (!d.isRevolving && d.paymentSource === 'Take-home') steps.push({ key: 'debt-' + d.id, label: d.name.replace(/ Loan$/, '') + ' payment protected', why: 'Protect the scheduled loan payment' });
    steps.push(
      { key: 'savings', label: 'Emergency savings transfer made', why: 'Build toward ' + sym + Math.round(+s.emergencyFundTarget || 0).toLocaleString('en-US') },
      { key: 'buffer', label: 'Cash buffer kept aside', why: 'Avoid borrowing back from the card' },
      { key: 'safe', label: 'Safe extra payment calculated', why: 'Use the calculator above' },
      { key: 'extra', label: 'Extra debt payment made', why: 'Only after the other steps are complete' });
    return steps;
  }
  function paydayChecklist(state, today) {
    const pd = cyclePayday(state, today), saved = ((state.paydayChecklists || {})[pd]) || {};
    const steps = paydaySteps(state).map(st => ({ ...st, status: saved[st.key] || 'Not Yet' }));
    const done = steps.filter(x => x.status === 'Done').length;
    return { payday: pd, steps, done, score: steps.length ? done / steps.length : 0 };
  }
  function checkInStats(state, monthIso) {
    const mk = monthKey(monthIso), all = state.weeklyCheckIns || [];
    const month = all.filter(c => c.date && monthKey(c.date) === mk);
    const logged = month.length, within = month.filter(c => c.stayedWithinPlan === true).length;
    const noNonEss = month.filter(c => c.nonEssentialCardUse === false).length;
    const clean = month.filter(c => c.stayedWithinPlan === true && c.nonEssentialCardUse === false).length;
    const allLogged = all.filter(c => c.date).length;
    const allScore = allLogged ? (all.filter(c => c.stayedWithinPlan === true).length + all.filter(c => c.nonEssentialCardUse === false).length) / (allLogged * 2) : 0;
    return { logged, within, noNonEss, clean, consistency: logged ? (within + noNonEss) / (logged * 2) : 0,
      allLogged, allConsistency: allScore, monthsWithCheckIn: new Set(all.filter(c => c.date).map(c => monthKey(c.date))).size };
  }
  function followThrough(state, today) {
    const pc = paydayChecklist(state, today), ci = checkInStats(state, monthStart(today));
    const score = (pc.done + ci.logged) / (pc.steps.length + 5);
    const target = state.settings.followThroughTarget != null ? +state.settings.followThroughTarget : 0.8;
    const next = ci.logged === 0 ? 'Log your first weekly check-in' : score >= target ? 'On track — keep showing up' : 'Close out the payday checklist';
    return { score, target, paydayDone: pc.done, paydaySteps: pc.steps.length, checkIns: ci.logged, cleanWeeks: ci.clean, next };
  }
  function checkInDefaults(state, today, calc) {
    // Pre-fill from the log: last 7 days of spending, and any non-essential card purchase.
    const from = addDays(today, -6); let spent = 0, nonEss = false;
    for (const t of state.transactions) {
      if (!t.date || t.date < from || t.date > today || flowType(t, state) !== 'Expense') continue;
      spent += +t.amount; if (t.paymentMethod === 'Credit Card' && !t.essential) nonEss = true;
    }
    return { date: today, spendableCash: calc.cash, cardBalance: calc.card ? calc.card.balance : 0, spentThisWeek: spent, nonEssentialCardUse: nonEss };
  }

  // ---------- D9 month-end balances & trend (workbook Month History K–O) ----------
  function monthEnd(monthIso) { const { y, m } = ymd(monthIso); return dateCapped(y, m, 31); }
  function snapshotSeries(state) {
    const snaps = (state.monthSnapshots || []).filter(x => x.month).slice().sort((a, b) => a.month < b.month ? -1 : 1);
    let prev = null;
    return snaps.map(sn => {
      const per = state.debts.map(d => ({ id: d.id, name: d.name, balance: sn.balances && sn.balances[d.id] != null ? +sn.balances[d.id] : null }));
      const recorded = per.filter(x => x.balance != null);
      const total = recorded.length ? recorded.reduce((a, x) => a + x.balance, 0) : null;          // N = SUM of entered balances
      const change = total != null && prev != null ? total - prev : null;                          // O = N - previous N
      prev = total != null ? total : prev;
      return { month: sn.month, monthKey: monthKey(sn.month), monthEnd: monthEnd(sn.month), debts: per, total, change, note: sn.note || '' };
    });
  }

  const cardStat = card ? `<a href="#debts"><span>Card used</span><b>${Math.round(card.used * 100)}%</b></a>` : `<div><span>Total owed</span><b>${shortMoney(c.totalDebt)}</b></div>`;
  v.innerHTML = `${banner}${setupNeeded}
    <section class="hero">
      <div class="row" style="align-items:center"><div class="lbl">Safe to spend</div>${card ? `<span class="pill">${card.status}</span>` : ''}</div>
      <div class="money"><span class="cur">${esc(sym())}</span>${Math.round(c.safeToSpend).toLocaleString('en-US')}</div>
      <p>Until payday, ${wd(c.nextPayday)} ${fmtDate(c.nextPayday, false)}. Bills, debt payments, savings and your buffer are already set aside.</p>
      <div class="hero-stats">
        <a href="#payday"><span>Cash</span><b>${shortMoney(c.cash)}</b></a>
        <a href="#payday"><span>Safe extra</span><b class="hl">${shortMoney(c.safeExtra)}</b></a>
        ${cardStat}
      </div>
    </section>
    <div class="stack">
      ${comingUp()}
      <div class="grid2">${tiles}</div>
      ${homeSaveOrPay()}
      ${more}
    </div>`;
}

function waterfallTable(c) {
  return `<table>
      <tr><td>Net pay not yet counted</td><td>${two(c.netPayReceived)}</td></tr>
      <tr><td>Other income</td><td>${two(c.otherIncome)}</td></tr>
      <tr><td>Cash on hand (live)</td><td>${two(c.cash)}</td></tr>
      <tr class="total"><td>Total available</td><td>${two(c.totalAvailable)}</td></tr>
      <tr><td>Take-home debt payments still due</td><td>−${two(c.takeHomeDebtDue)}</td></tr>
      <tr><td>Unpaid bills due by payday</td><td>−${two(c.billsBeforePayday)}</td></tr>
      <tr><td>Outside savings this cycle</td><td>−${two(c.savingsThisCycle)}</td></tr>
      <tr><td>Cash buffer</td><td>−${two(c.cashBuffer)}</td></tr>
      <tr class="total"><td>Safe to spend</td><td>${two(c.safeToSpend)}</td></tr>
      <tr><td>Budget still to spend this cycle</td><td>−${two(c.budgetStillToSpend)}</td></tr>
      <tr class="total"><td>Safe extra payment</td><td>${two(c.safeExtra)}</td></tr>
    </table>`;
}
function sparkline(rows) {
  if (!rows || rows.length < 2) return '';
  const W = 320, H = 56, max = rows[0].total || 1, n = rows.length - 1;
  const pts = rows.map((r, i) => [i / n * W, 4 + (1 - r.total / max) * (H - 8)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${line} L${W} ${H} L0 ${H} Z" fill="var(--accent-soft)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// ---------- activity ----------
let filt = { q: '', cat: '', method: '' };
function renderActivity() {
  const v = $('#view');
  const cats = [...new Set(state.transactions.map(t => t.category || ''))].sort();
  const rows = state.transactions.filter(t => {
    if (filt.cat === '__none') { if (t.category) return false; } else if (filt.cat && t.category !== filt.cat) return false;
    if (filt.method && t.paymentMethod !== filt.method) return false;
    if (filt.q) { const q = filt.q.toLowerCase(); if (!((t.description || '') + ' ' + (t.category || '') + ' ' + (t.notes || '')).toLowerCase().includes(q)) return false; }
    return true;
  }).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const groups = new Map();
  for (const t of rows) { const k = E.monthKey(t.date); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  const unc = state.transactions.filter(t => !t.category).length;
  let html = `<div class="toolbar"><button class="tbtn" id="btn-import" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Import statement</button><button class="tbtn" id="btn-export" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>Export CSV</button></div>`;
  html += unc ? `<div class="banner" style="margin-bottom:12px"><span>${unc} transaction${unc > 1 ? 's need' : ' needs'} a category.</span><button id="showunc">Show</button></div>` : '';
  html += `<div class="search">
    <input class="in" id="f-q" type="search" placeholder="Search description, category or notes" value="${esc(filt.q)}" aria-label="Search transactions">
    <div class="filters">
      <select class="in" id="f-cat" aria-label="Filter by category"><option value="">All categories</option>${unc ? `<option value="__none"${filt.cat === '__none' ? ' selected' : ''}>No category</option>` : ''}${cats.filter(Boolean).map(c => `<option${c === filt.cat ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select class="in" id="f-m" aria-label="Filter by payment method"><option value="">All methods</option>${METHODS.map(m => `<option value="${m}"${m === filt.method ? ' selected' : ''}>${METHOD_LABEL[m]}</option>`).join('')}</select>
    </div></div>`;
  if (!rows.length) html += `<div class="empty">${state.transactions.length ? 'Nothing matches those filters.' : 'No transactions yet. Tap + to log your first one.'}</div>`;
  for (const [k, list] of groups) {
    const spent = list.filter(t => E.flowType(t, state) === 'Expense').reduce((a, t) => a + +t.amount, 0);
    html += `<div class="month-h"><h2>${monthLabel(k)}</h2><span class="small muted">${whole(spent)} spent</span></div><section class="card" style="padding-block:4px"><ul class="list">` +
      list.map(t => {
        const ft = E.flowType(t, state);
        const cls = ft === 'Income' ? 'inc' : t.paymentMethod === 'Credit Card' ? 'cc' : '';
        return `<li><button class="txn" data-tx="${esc(t.id)}"><div class="main"><div class="t">${esc(t.description || t.category || 'Untitled')}</div>
          <div class="s">${fmtDate(t.date, false)} · ${t.category ? esc(t.category) : '<span style="color:var(--warn);font-weight:600">No category</span>'} · ${METHOD_LABEL[t.paymentMethod] || esc(t.paymentMethod)}</div></div>
          <div class="amt ${cls}">${ft === 'Income' ? '+' : ''}${two(t.amount)}</div></button></li>`;
      }).join('') + `</ul></section>`;
  }
  v.innerHTML = html;
  const q = $('#f-q'); q.addEventListener('input', () => { filt.q = q.value; const pos = q.selectionStart; renderActivity(); const n = $('#f-q'); n.focus(); n.setSelectionRange(pos, pos); });
  $('#f-cat').addEventListener('change', e => { filt.cat = e.target.value; renderActivity(); });
  $('#f-m').addEventListener('change', e => { filt.method = e.target.value; renderActivity(); });
  $('#btn-import').addEventListener('click', openImport);
  $('#btn-export').addEventListener('click', openExport);
  const su = $('#showunc'); if (su) su.addEventListener('click', () => { filt = { q: '', cat: '__none', method: '' }; renderActivity(); });
  v.querySelectorAll('[data-tx]').forEach(b => b.addEventListener('click', () => openTx(state.transactions.find(t => t.id === b.dataset.tx))));
}

// ---------- month comparison (R20) ----------
function shortMonth(iso) { return MON[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4); }
function homeCompare() {
  const m = state.settings.planningMonth; if (!m) return '';
  const c = E.compareMonths(state, m), cur = shortMonth(m), prev = shortMonth(c.previousMonth);
  let text;
  if (c.status === 'no prior data') text = `No transactions logged for ${prev}, so the month-over-month comparison starts once both months have data.`;
  else if (c.status === 'not logged yet') text = `No spending or debt payments logged for ${cur} yet. The comparison with ${prev} fills in as you log transactions.`;
  else {
    const sp = c.rows.find(x => x.metric === 'Total Spend'), dp = c.rows.find(x => x.metric === 'Debt Payments');
    text = `${cur} so far: ${whole(sp.current)} spent (${sp.direction} ${whole(Math.abs(sp.change))} on ${prev}) and ${whole(dp.current)} paid to debt.`;
  }
  return `<section class="card"><div class="row"><h2>This month vs last</h2><a class="small" href="#plan" style="color:var(--accent);font-weight:600;text-decoration:none">Plan →</a></div><p class="small muted" style="margin:6px 0 0">${text}</p></section>`;
}
const DIR_TXT = { up: '▲ up', down: '▼ down', flat: '— flat', 'no prior data': 'no prior data', 'not logged yet': 'not logged yet' };
function compareCard(monthIso) {
  const c = E.compareMonths(state, monthIso);
  const rowsHtml = c.rows.map(r => {
    const cls = r.good === true ? 'good' : r.good === false ? 'bad' : 'neutral';
    return `<tr><td>${r.metric}</td><td>${whole(r.current)}</td><td>${whole(r.previous)}</td><td><span class="dir ${cls}">${DIR_TXT[r.direction]}</span></td></tr>`;
  }).join('');
  const note = c.status === 'no prior data' ? `Nothing logged for ${shortMonth(c.previousMonth)}, so there is nothing to compare yet.`
    : c.status === 'not logged yet' ? `No spending or debt payments logged for ${shortMonth(monthIso)} yet.` : 'Green marks a move in the better direction.';
  return `<section class="card"><h2>${shortMonth(monthIso)} vs ${shortMonth(c.previousMonth)}</h2>
    <div class="tablewrap"><table class="cmp"><thead><tr><th>Flow</th><th>${MON[+monthIso.slice(5, 7) - 1]}</th><th>${MON[+c.previousMonth.slice(5, 7) - 1]}</th><th>Direction</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    <p class="hint" style="margin:10px 0 0">${note}</p></section>`;
}

// ---------- Monthly Plan (S4) ----------
let planMonth = null;
const STATUS_PILL = { 'Not started': 'plain', 'On plan': 'green', 'Over': 'red', 'Posted': 'amber', 'Nothing posted': 'plain', 'Waiting for payday': 'plain', 'Below plan': 'amber' };
function fold(title, sub, body, open, spent, budget) {
  const bar = budget > 0 ? `<div class="bar" style="margin-top:8px"><span class="${spent > budget ? 'over' : ''}" style="width:${Math.min(spent / budget, 1) * 100}%"></span></div>` : '';
  return `<details class="fold"${open ? ' open' : ''}><summary><div class="row"><h2>${esc(title)}</h2><span class="small muted">${sub}</span></div>${bar}</summary><div class="fold-body">${body}</div></details>`;
}
function renderPlan() {
  const v = $('#view');
  if (!planMonth) planMonth = state.settings.planningMonth || todayISO().slice(0, 8) + '01';
  const p = E.monthlyPlan(state, planMonth, calc), t = p.totals;
  const isPlanning = planMonth === state.settings.planningMonth;
  const prow = r => {
    const used = r.budget > 0 ? Math.min(r.actual / r.budget, 1) : (r.actual > 0 ? 1 : 0);
    return `<div class="prow"><div class="row"><span class="t">${esc(r.name)}</span><span class="pill ${STATUS_PILL[r.status] || 'plain'}">${r.status}</span></div>
      <div class="row small"><span class="muted">${whole(r.actual)} of ${whole(r.budget)}</span><span class="${r.remaining < 0 ? 'cc' : 'muted'}">${r.remaining < 0 ? whole(-r.remaining) + ' over' : whole(r.remaining) + ' left'}</span></div>
      ${r.budget > 0 ? `<div class="bar"><span class="${r.actual > r.budget ? 'over' : ''}" style="width:${used * 100}%"></span></div>` : ''}</div>`;
  };
  const groups = ['Living', 'Flexible', 'Sinking Fund', 'Other'];
  const shown = p.spending.filter(r => r.budget > 0 || r.actual > 0), hidden = p.spending.filter(r => !(r.budget > 0 || r.actual > 0) && !r.interest).length;
  let groupsHtml = '';
  for (const g of groups) {
    const rows = shown.filter(r => r.group === g); if (!rows.length) continue;
    const b = rows.reduce((a, r) => a + r.budget, 0), a = rows.reduce((x, r) => x + r.actual, 0);
    groupsHtml += fold(g, `${whole(a)} of ${whole(b)}`, rows.map(prow).join(''), rows.some(r => r.status === 'Over'), a, b);
  }
  const others = [...shown.filter(r => !groups.includes(r.group))];
  if (others.length) groupsHtml += fold('More', '', others.map(prow).join(''), others.some(r => r.status === 'Over'));
  const db = p.debts.filter(r => r.group === 'Debt'), dpr = p.debts.filter(r => r.group === 'Debt (payroll)');
  groupsHtml += fold('Debt payments', `${whole(db.reduce((x, r) => x + r.actual, 0))} of ${whole(t.plannedDebt)}`, db.map(prow).join(''), false, db.reduce((x, r) => x + r.actual, 0), t.plannedDebt);
  if (dpr.length) groupsHtml += fold('Paid from payroll', 'Not counted against take-home', dpr.map(prow).join(''), false);
  groupsHtml += fold('Savings', `${whole(p.savings.actual)} of ${whole(p.savings.budget)}`, prow(p.savings), false, p.savings.actual, p.savings.budget);
  const intRows = [...p.spending.filter(r => r.interest && !(r.budget > 0 || r.actual > 0)), ...p.interest];
  if (intRows.length) groupsHtml += fold('Interest posted', 'Non-cash, raises the balance', intRows.map(prow).join(''), false);
  const spentPct = t.livingTotal > 0 ? Math.min(t.spentLiving / t.livingTotal, 1) : 0;
  v.innerHTML = `
    ${planNav('plan')}
    <div class="stepper"><button id="pm-prev" aria-label="Previous month">‹</button><h1>${MON[+planMonth.slice(5, 7) - 1]} ${planMonth.slice(0, 4)}</h1><button id="pm-next" aria-label="Next month">›</button></div>
    <div class="stack">
      <section class="card">
        <div class="row"><h2>Spending budget</h2><span class="pill ${STATUS_PILL[p.income.status] || 'plain'}">Pay: ${p.income.status}</span></div>
        <span class="money m">${whole(t.spentLiving)} <span class="muted small" style="font-family:var(--f-ui);font-weight:500">of ${whole(t.livingTotal)}</span></span>
        <div class="bar"><span class="${t.spentLiving > t.livingTotal ? 'over' : ''}" style="width:${spentPct * 100}%"></span></div>
        <div class="kv">
          <div><span class="lbl">Net pay</span><b>${whole(p.income.actual)} <span class="muted small">of ${whole(p.income.budget)}</span></b></div>
          <div><span class="lbl">Planned cushion</span><b style="color:${t.cushion < 0 ? 'var(--bad)' : 'inherit'}">${whole(t.cushion)}</b></div>
          <div><span class="lbl">Planned debt</span><b>${whole(t.plannedDebt - (calc ? calc.safeExtra : 0))} <span class="muted small">+ extra</span></b></div>
          <div><span class="lbl">Planned savings</span><b>${whole(t.plannedSavings)}</b></div>
        </div>
        <p class="hint" style="margin:10px 0 0">${isPlanning ? 'This is your planning month.' : 'Budgets are the same every month; actuals are for the month shown.'} Cushion is net pay less budgets, take-home debt payments and savings, before any extra payment.</p>
      </section>
    </div>
    <div class="stack" style="margin-top:12px">${groupsHtml}
    <details class="fold"><summary><div class="row"><h2>${shortMonth(planMonth)} vs last month</h2><span class="small muted">Flows</span></div></summary><div class="fold-body">${compareCard(planMonth)}</div></details></div>
    ${hidden ? `<p class="hint" style="margin:12px 2px 0">${hidden} categor${hidden === 1 ? 'y has' : 'ies have'} no budget and no spending this month, so ${hidden === 1 ? 'it is' : 'they are'} hidden.</p>` : ''}`;
  $('#pm-prev').addEventListener('click', () => { planMonth = E.edate(planMonth, -1); renderPlan(); });
  $('#pm-next').addEventListener('click', () => { planMonth = E.edate(planMonth, 1); renderPlan(); });
}

// ---------- Debts (S5) ----------
function monthsDiff(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + bm - am; }
const ACTION_PILL = { 'ATTACK FIRST': 'green', 'NEXT': 'plain', 'MAINTAIN': 'plain' };
const PACE_PILL = { 'AHEAD': 'green', 'ON TRACK': 'green', 'BEHIND': 'red' };
function debtNav(cur) { return `<nav class="navseg"><a href="#debts" aria-current="${cur === 'debts' ? 'page' : 'false'}">Balances</a><a href="#payoff" aria-current="${cur === 'payoff' ? 'page' : 'false'}">Payoff plan</a></nav>`; }
function renderDebts() {
  const v = $('#view'), c = calc;
  if (!c || !c.debts.length) { v.innerHTML = debtNav('debts') + '<div class="empty">No debts yet. Add them in Setup.</div>'; return; }
  const req = c.debts.reduce((a, d) => a + (+d.requiredPayment || 0), 0);
  const int = c.debts.reduce((a, d) => a + d.estInterest, 0);
  const cards = c.debts.slice().sort((a, b) => a.priority - b.priority).map(d => {
    const pr = d.progress;
    let prog = '';
    if (pr) {
      const vsContract = pr.projectedPayoff && d.endDate ? monthsDiff(pr.projectedPayoff, d.endDate) : null;
      prog = `<div class="row" style="margin-top:14px"><span class="lbl">Loan progress</span><span class="pill ${PACE_PILL[pr.pace]}">${pr.pace}</span></div>
        <div class="meter" role="img" aria-label="${pct(pr.pctPaid)} paid off, ${pct(pr.pctTerm)} of the term elapsed" style="height:10px;margin:10px 0 6px">
          <div class="fill" style="width:${Math.max(0, Math.min(pr.pctPaid, 1)) * 100}%;background:var(--accent)"></div>
          <div class="tick" style="left:${pr.pctTerm * 100}%" title="Share of term elapsed"></div></div>
        <div class="meter-legend"><span>${pct(pr.pctPaid)} paid off</span><span>${pct(pr.pctTerm)} of term gone</span></div>
        <dl class="dl">
          <dt>Scheduled balance today</dt><dd>${whole(pr.scheduledBalance)}</dd>
          <dt>${pr.ahead >= 0 ? 'Ahead of schedule' : 'Behind schedule'}</dt><dd>${whole(Math.abs(pr.ahead))}</dd>
          <dt>Projected payoff at this pace</dt><dd>${pr.projectedPayoff ? fmtDate(pr.projectedPayoff) : 'Never at this pace'}</dd>
          ${vsContract != null ? `<dt>vs contract end</dt><dd>${vsContract === 0 ? 'on time' : Math.abs(vsContract) + ' mo ' + (vsContract > 0 ? 'early' : 'late')}</dd>` : ''}
          <dt>Terms check</dt><dd style="color:${pr.termsCheck === 'OK' ? 'inherit' : 'var(--bad)'}">${pr.termsCheck}</dd>
        </dl>
        ${pr.termsCheck !== 'OK' ? `<p class="warnline">The original amount, dates and APR don’t imply this required payment, so the progress figures for this loan are unreliable. Check them in Setup.</p>` : ''}`;
    } else if (d.isRevolving && c.card) {
      prog = `<div class="row" style="margin-top:14px"><span class="lbl">Ceiling</span><span class="pill ${c.card.level}">${c.card.status}</span></div>
        <p class="small muted" style="margin:6px 0 0">${pct(c.card.used)} of the ${whole(c.card.hard)} hard ceiling used · ${whole(c.card.room)} room left.</p>`;
    }
    return `<details class="fold debt"><summary>
        <div class="row"><h2>${esc(d.name)}</h2><span class="pill ${ACTION_PILL[d.action]}">${d.action}</span></div>
        <div class="row" style="margin-top:4px"><span class="money m" style="margin:0">${whole(d.liveBalance)}</span><span class="small muted">${(d.apr * 100).toFixed(1)}% · due ${d.nextDue ? fmtDate(d.nextDue, false) : '—'}</span></div>
        ${d.progress ? `<div class="small muted" style="margin-top:4px">${pct(d.progress.pctPaid, 0)} paid off · <span style="color:${d.progress.pace === 'BEHIND' ? 'var(--bad)' : 'var(--good)'};font-weight:600">${d.progress.pace.toLowerCase()}</span></div>` : c.card && d.isRevolving ? `<div class="small muted" style="margin-top:4px">${pct(c.card.used, 0)} of ceiling · <span style="font-weight:600">${c.card.status.toLowerCase()}</span></div>` : ''}
      </summary><div class="fold-body">
      <dl class="dl" style="margin-top:0">
        <dt>Priority</dt><dd>${d.priority} of ${c.debts.length}</dd>
        <dt>Required payment</dt><dd>${whole(d.requiredPayment)}</dd>
        <dt>Next due</dt><dd>${d.nextDue ? wd(d.nextDue) + ' ' + fmtDate(d.nextDue) : '—'}</dd>
        <dt>Paid from</dt><dd>${d.paymentSource === 'Payroll' ? 'Payroll deduction' : 'Take-home pay'}</dd>
        <dt>Est. monthly interest</dt><dd>${whole(d.estInterest)}</dd>
      </dl>${prog}<div style="height:8px"></div></div></details>`;
  }).join('');
  v.innerHTML = `${debtNav('debts')}
    <section class="hero">
      <div class="lbl">Total owed today</div>
      <div class="money"><span class="cur">${esc(sym())}</span>${Math.round(c.totalDebt).toLocaleString('en-US')}</div>
      <div class="hero-stats">
        <div><span>Monthly</span><b>${shortMoney(req)}</b></div>
        <div><span>Interest</span><b>${shortMoney(int)}</b></div>
        <a href="#payoff"><span>Debt-free</span><b class="hl">${c.payoff.debtFree ? MON[+c.payoff.date.slice(5, 7) - 1] + ' ’' + c.payoff.date.slice(2, 4) : '8+ yrs'}</b></a>
      </div>
    </section>
    <div class="stack">${cards}${snapshotCard(c)}</div>
    <p class="hint" style="margin:12px 2px 0">${state.settings.payoffMethod} order: ${state.settings.payoffMethod === 'Snowball' ? 'smallest balance first' : 'highest rate first'}. Balances move with what you log: payments lower them, interest you post raises them. Tap a debt for details.</p>`;
  wireTrend();
}

// ---------- Month-end balances & trend (D9) ----------
function snapshotCard(c) {
  const tr = E.trend(state, c), ser = tr.series;
  const due = E.snapshotDue(state, todayISO());
  const target = due || todayISO().slice(0, 8) + '01';
  const debts = state.debts;
  const short = n => n.replace(/ Loan$/, '').replace(/ Gold$/, '');
  const rows = ser.slice().reverse().map(x => `<tr data-snaprow="${esc(x.month)}" style="cursor:pointer"><td>${shortMonth(x.month)}</td>${x.debts.map(d => `<td>${d.balance != null ? shortMoney(d.balance) : '—'}</td>`).join('')}<td><b>${x.total != null ? whole(x.total) : '—'}</b></td><td class="${x.change == null ? '' : x.change <= 0 ? 'inc' : 'cc'}">${x.change == null ? '—' : (x.change <= 0 ? '▼ ' : '▲ ') + whole(Math.abs(x.change))}</td></tr>`).join('');
  return `<details class="fold"${due ? ' open' : ''}><summary><div class="row"><h2>Month-end trend</h2><span class="small muted">${ser.length ? ser.length + ' month' + (ser.length === 1 ? '' : 's') + ' recorded' : 'Not started'}</span></div></summary><div class="fold-body">
    ${ser.length ? '' : `<p class="small muted" style="margin:6px 0 0">Once a month, enter each debt's statement balance. Your recorded totals build a trend line next to the payoff projection.</p>`}

let showAllComing = false;
function comingUp() {
  if (!calc) return '';
