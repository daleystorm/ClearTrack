  const total = items.length; if (!showAllComing) items.splice(4);
  const li = items.map(it => {
    const n = it.days, hot = it.kind === 'bill' ? it.overdue || n <= 3 : it.kind === 'due' ? !it.covered && n <= 3 : n <= 1;
    const whenTxt = n < 0 ? Math.abs(n) + ' days late' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days';
    let detail = '', action = '';
    if (it.kind === 'payday') { detail = `${wd(it.date)} · ${whenTxt}`; action = `<a class="mini" href="#payday" style="display:inline-grid;place-items:center;text-decoration:none;color:inherit">Checklist</a>`; }
    if (it.kind === 'due') detail = `${whole(it.amount)} · ${whenTxt} · ${it.payroll ? 'deducted from pay' : it.covered ? 'payment logged' : it.paid > 0 ? whole(it.paid) + ' logged so far' : 'not logged yet'}`;
    if (it.kind === 'backup') { detail = pref.lastBackup ? `Last one ${fmtDate(pref.lastBackup, false)} · data lives only here` : 'Your data lives only on this phone'; action = `<button class="mini" type="button" data-backup="1">Back up</button>`; }
    if (it.kind === 'snapshot') { detail = `Statement balances for ${shortMonth(it.month)}`; action = `<button class="mini" type="button" data-snap="${esc(it.month)}">Record</button>`; }
    if (it.kind === 'bill') { detail = `${whole(it.amount)} · ${it.overdue ? '<b style="color:var(--bad)">' + whenTxt + '</b>' : whenTxt} `; action = `<button class="mini" type="button" data-billpaid="${esc(it.id)}">Mark paid</button>`; }
    return `<div class="rem"><div class="when${hot ? ' hot' : ''}"><b>${+it.date.slice(8)}</b><span>${MON[+it.date.slice(5, 7) - 1]}</span></div>

  }).join('');

}
document.addEventListener('click', async e => {
  if (e.target.closest('#cu-all')) { showAllComing = !showAllComing; render(); return; }

// ---------- CSV export (N4) ----------
async function exportFile(kind) {
  const data = kind === 'transactions' ? E.transactionsCSV(state) : E.balancesCSV(state, calc);
  const filename = `cleartrack-${kind}-${todayISO()}.csv`;
  await saveFile(filename, data, 'text/csv');
}
async function saveFile(filename, data, mime) {
  // Returns true when the file was handed over.
  if (STANDALONE) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: mime }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); showToast('Saved ' + filename + ' to Downloads'); return true;
    } catch (e) { openCopy(filename, data); return false; }
  }
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (!dl) { openCopy(filename, data); return false; }
  try { await dl.save({ filename, data }); showToast('Saved ' + filename); return true; }
  catch (e) {
    if (e && e.code === 'declined') return false;
    if (e && e.code === 'rate_limited') { showToast('A save is already open. Finish it first.'); return false; }
    openCopy(filename, data); return false;
  }
}

}

// ---------- statement import (R21) ----------
let imp = null;
function guessCols(rows) {
  const first = rows[0] || [];
  const header = first.length >= 2 && !E.parseStatementDate(first[0]) && E.parseAmount(first[first.length - 1]) == null;
  const h = header ? first.map(x => String(x).toLowerCase()) : [];
  const find = re => h.findIndex(x => re.test(x));
  let date = find(/date/), desc = find(/desc|detail|narr|merchant|particular|payee|transaction|reference/), amount = find(/amount|amt|value/);
  const debit = find(/debit|withdraw|charge/), credit = find(/credit|deposit|payment/);
  if (date < 0) date = 0; if (desc < 0) desc = Math.min(1, first.length - 1);
  if (amount < 0 && debit < 0) amount = Math.min(2, first.length - 1);
  return { header, date, desc, amount, debit: amount < 0 ? debit : -1, credit: amount < 0 ? credit : -1 };
}
function openImport() {
  imp = { step: 1, text: '', method: 'Credit Card', dayFirst: true, rows: [], cols: null, picks: {}, include: {}, remember: {} };
  drawImport();
}
function importRows() {
  const c = imp.cols, body = c.header ? imp.rows.slice(1) : imp.rows;
  return body.map(r => {
    let amount = c.amount >= 0 ? r[c.amount] : null;
    if (c.amount < 0) { const dv = E.parseAmount(r[c.debit]), cv = E.parseAmount(r[c.credit]); amount = dv ? dv : cv ? -Math.abs(cv) : null; }
    return { date: r[c.date], description: r[c.desc], amount };
  });
}
function suggestKeyword(desc) { return String(desc || '').split(/[,\-–*#]| - /)[0].replace(/\s+\d.*$/, '').trim().slice(0, 30); }
function drawImport() {
  const layer = $('#layer');
  if (imp.step === 1) {

  const catOpts = sel => ['<option value="">Pick a category…</option>', ...catsByUse().map(x => `<option${x.name === sel ? ' selected' : ''}>${esc(x.name)}</option>`)].join('');
  const PILL = { 'Ready': 'green', 'Already logged': 'plain', 'Pick a category': 'amber', 'Fix date / amount': 'red' };
  const list = preview.map(p => `<div class="imp">

      ${p.status === 'Fix date / amount' ? '' : `<select class="in" data-pick="${p.index}" aria-label="Category for ${esc(p.description)}">${catOpts(p.category)}</select>`}
      ${imp.picks[p.index] && !p.suggested && p.signed >= 0 ? `<label class="toggle" style="min-height:40px"><span class="small">Remember “<input class="in" data-kw="${p.index}" value="${esc(imp.remember[p.index] != null ? imp.remember[p.index] : suggestKeyword(p.description))}" style="display:inline;width:9em;min-height:30px;padding:2px 6px" aria-label="Keyword to remember">” as ${esc(imp.picks[p.index])}</span><input type="checkbox" data-rem="${p.index}"${imp.remember[p.index] !== undefined ? ' checked' : ''}></label>` : ''}

      <label class="toggle" style="margin-top:10px" for="ic-head"><span>First row is a header</span><input type="checkbox" id="ic-head"${c.header ? ' checked' : ''}></label></details>
    <section class="card" style="padding-block:2px;margin-top:10px">${list}</section>
    <p class="hint">Rows already logged (same date and amount) are left out unless you tick them.</p>
    <div class="actions"><button class="btn primary" type="button" id="im-go"${nAdd ? '' : ' disabled'}>Add ${nAdd} transaction${nAdd === 1 ? '' : 's'}</button><button class="btn ghost" type="button" id="im-back">Back</button></div></div></div>`;
  const keep = () => { const sh = layer.querySelector('.sheet'); return sh ? sh.scrollTop : 0; };

  </form></div>`;
  const amt = $('#tx-amount');
  if (!editing) setTimeout(() => amt.focus(), 50);

  layer.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { t.paymentMethod = b.dataset.m; layer.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));

    <div class="two">${num('s-crit', 'Critical at % of hard', +(s.criticalPct * 100).toFixed(2), '', '0.1')}${num('s-watch', 'Watch at % of hard', +(s.watchPct * 100).toFixed(2), '', '0.1')}</div>`;
  const savings = `${num('s-osav', 'Monthly outside savings', s.monthlyOutsideSavings)}
    ${num('s-buf', 'Cash buffer to keep after payday', s.cashBufferTarget)}
    ${num('s-ef', 'Emergency fund target', s.emergencyFundTarget)}
    <div class="two"><div class="field"><label for="s-emacct">Emergency fund account</label><select class="in" id="s-emacct">${d.savingsAccounts.map(a => `<option value="${esc(a.id)}"${a.id === s.emergencyAccountId ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
    ${num('s-mincover', 'Minimum months of cover', s.minCoverMonths ?? 1, 'Before extra debt payments', '0.5')}</div>`;
  const payoff = `${sel('s-method', 'Payoff method', s.payoffMethod, ['Avalanche', 'Snowball'])}

    ${num('s-extra', 'Monthly extra payment', s.monthlyExtraPayment, c ? 'Your Safe Extra Payment right now is ' + whole(c.safeExtra) + '.' : '')}`;

  const catItems = d.categories.map((x, i) => `<div class="item">
      ${txt('c-name-' + i, 'Category', x.name)}
      <div class="two">${num('c-bud-' + i, 'Monthly budget', x.monthlyBudget)}${sel('c-type-' + i, 'Type', x.type, ['Living', 'Flexible', 'Subscription', 'Utility', 'Sinking Fund', 'Other'])}</div>
      <label class="toggle" for="c-ess-${i}"><span>Essential</span><input type="checkbox" id="c-ess-${i}"${x.essential ? ' checked' : ''}></label>
      <button type="button" class="linkbtn del" data-del="categories" data-i="${i}">Remove category</button></div>`).join('');
  const budTotal = d.categories.reduce((a, x) => a + (+x.monthlyBudget || 0), 0);
  const cats = `<p class="hint" style="margin:0">Total monthly budget ${whole(budTotal)}.</p>${catItems}<button type="button" class="linkbtn" data-add="categories">+ Add category</button>`;

  const debtItems = d.debts.map((x, i) => `<div class="item">
      ${txt('d-name-' + i, 'Debt name', x.name)}
      <div class="two">${num('d-bal-' + i, 'Balance', x.balance)}${date('d-asof-' + i, 'Balance as of', x.balanceAsOf)}</div>
      <div class="three">${num('d-apr-' + i, 'APR %', +(x.apr * 100).toFixed(4), '', '0.01')}${num('d-req-' + i, 'Required payment', x.requiredPayment)}${num('d-due-' + i, 'Due day', x.dueDay, '', '1')}</div>
      <div class="two">${sel('d-src-' + i, 'Paid from', x.paymentSource, ['Take-home', 'Payroll'])}<div class="field"><span class="lbl">Card?</span><label class="toggle" for="d-rev-${i}"><span>Revolving card</span><input type="checkbox" id="d-rev-${i}"${x.isRevolving ? ' checked' : ''}></label></div></div>
      ${x.isRevolving ? '' : `<div class="three">${num('d-orig-' + i, 'Original amount', x.originalAmount)}${date('d-start-' + i, 'Loan start', x.startDate)}${date('d-end-' + i, 'Loan end', x.endDate)}</div>`}
      <p class="hint" style="margin:0">Logs as “${esc(x.name)} Payment”${x.isRevolving ? ' and “Card Interest”' : ' and “' + esc(x.name) + ' Interest”'}. A balance-as-of date already includes that day.</p>
      <button type="button" class="linkbtn del" data-del="debts" data-i="${i}">Remove debt</button></div>`).join('');
  const debts = `${debtItems}<button type="button" class="linkbtn" data-add="debts">+ Add debt</button>`;

  const billItems = d.bills.map((x, i) => `<div class="item">
      ${txt('b-name-' + i, 'Bill', x.name)}
      <div class="two">${num('b-amt-' + i, 'Amount', x.amount)}${date('b-due-' + i, 'Due date', x.dueDate)}</div>
      <label class="toggle" for="b-paid-${i}"><span>Paid</span><input type="checkbox" id="b-paid-${i}"${x.paid ? ' checked' : ''}></label>
      <button type="button" class="linkbtn del" data-del="bills" data-i="${i}">Remove bill</button></div>`).join('');
  const bills = `<p class="hint" style="margin:0">Unpaid bills due on or before next payday are set aside before anything is safe to spend.</p>${billItems}<button type="button" class="linkbtn" data-add="bills">+ Add one-off bill</button>`;

  const savItems = d.savingsAccounts.map((x, i) => `<div class="item">
      ${txt('a-name-' + i, 'Account', x.name)}
      <div class="two">${num('a-bal-' + i, 'Balance', x.balance)}${txt('a-cur-' + i, 'Currency', x.currency)}</div>
      <label class="toggle" for="a-acc-${i}"><span>Can be withdrawn</span><input type="checkbox" id="a-acc-${i}"${x.accessible ? ' checked' : ''}></label>
      <button type="button" class="linkbtn del" data-del="savingsAccounts" data-i="${i}">Remove account</button></div>`).join('');
  const sav = `${savItems}<button type="button" class="linkbtn" data-add="savingsAccounts">+ Add savings account</button>`;

  const prItems = d.payrollDeductions.map((x, i) => `<div class="item">
      ${txt('p-name-' + i, 'Deduction', x.name)}
      <div class="two">${num('p-amt-' + i, 'Monthly amount', x.monthlyAmount)}${txt('p-cat-' + i, 'Kind', x.category)}</div>
      <div class="two"><div class="field"><label for="p-less-${i}">Part of it pays a loan</label><select class="in" id="p-less-${i}"><option value="">No</option>${d.debts.map(dd => `<option value="${esc(dd.id)}"${dd.id === x.lessDebtId ? ' selected' : ''}>${esc(dd.name)}</option>`).join('')}</select></div>${txt('p-to-' + i, 'Savings go to', x.savesTo || '')}</div>
      <button type="button" class="linkbtn del" data-del="payrollDeductions" data-i="${i}">Remove deduction</button></div>`).join('');
  const pr = `<p class="hint" style="margin:0">These come out before net pay, so the payday calculations ignore them. A deduction of kind “Savings”, or the part left after a loan payment, counts toward your monthly savings.</p>${prItems}<button type="button" class="linkbtn" data-add="payrollDeductions">+ Add deduction</button>`;
  const catOpts = sel => ['<option value="">Choose…</option>', ...allCategories().map(c => `<option${c.name === sel ? ' selected' : ''}>${esc(c.name)}</option>`)].join('');
  const ruleItems = (d.merchantRules || []).map((x, i) => `<div class="rule">
      <input class="in" id="r-kw-${i}" value="${esc(x.keyword)}" aria-label="Keyword ${i + 1}">
      <select class="in" id="r-cat-${i}" aria-label="Category for ${esc(x.keyword)}">${catOpts(x.category)}</select>
      <div class="ord"><button type="button" data-move="${i}" data-dir="-1" aria-label="Move up"${i === 0 ? ' disabled' : ''}>↑</button><button type="button" data-rdel="${i}" aria-label="Remove rule">✕</button></div></div>`).join('');
  const rules = `<p class="hint" style="margin:0 0 6px">When a statement description contains the keyword, the import suggests that category. The first match from the top wins, so keep specific keywords above general ones.</p>${ruleItems}<button type="button" class="linkbtn" data-add="merchantRules">+ Add rule</button>`;
  const exp = `<p class="hint" style="margin:0">Keep the spreadsheet as a cross-check. The transactions file uses the same columns as the workbook's Transactions tab.</p>
    <div class="actions"><button class="btn primary" type="button" id="ex-tx">Export transactions (.csv)</button><button class="btn danger" style="background:var(--surface-2);color:var(--ink)" type="button" id="ex-bal">Export balances (.csv)</button></div>
    <h3 style="font-size:15px;margin:18px 0 4px">Backup</h3>
    <p class="hint" style="margin:0">A backup file holds everything: setup, transactions, goals and check-ins. ${STANDALONE ? 'Your data lives only on this phone, so save a backup every week or two and keep a copy somewhere safe, such as Google Drive.' : 'Use it to move your data to the phone app.'}${pref.lastBackup ? ' Last backup: ' + fmtDate(pref.lastBackup) + '.' : ''}</p>
    <div class="actions"><button class="btn primary" type="button" id="bk-save">Back up now (.json)</button>${mode === 'cloud' ? '' : '<button class="btn" style="background:var(--surface);border:1px solid var(--line)" type="button" id="bk-restore">Restore from a backup</button>'}</div>`;

  v.innerHTML = `<div class="stack">
    ${sec('pay', 'Pay', pay)}
    ${sec('cash', 'Cash on hand', cash)}
    ${sec('card', 'Credit card ceilings', card)}
    ${sec('savings', 'Savings and buffer', savings)}
    ${sec('payoff', 'Payoff plan', payoff)}
    ${sec('cats', 'Budget categories (' + d.categories.length + ')', cats)}
    ${sec('debts', 'Debts (' + d.debts.length + ')', debts)}
    ${sec('bills', 'One-off bills (' + d.bills.length + ')', bills)}
    ${sec('sav', 'Savings accounts (' + d.savingsAccounts.length + ')', sav)}
    ${sec('payroll', 'Payroll deductions (' + d.payrollDeductions.length + ')', pr)}
    ${sec('goals', 'Savings goals (' + (d.savingsGoals || []).length + ')', goalsHtml(d))}
    ${sec('rules', 'Merchant rules (' + (d.merchantRules || []).length + ')', rules)}
    ${sec('look', 'Appearance', `<p class="hint" style="margin:0 0 10px">Pick a colour theme. Dark mode follows your phone's setting.</p><div class="swatches">${THEMES.map(([k, label, a, b]) => `<button type="button" data-theme-pick="${k}" aria-pressed="${(pref.theme || 'harbour') === k}"><i style="background:radial-gradient(120% 140% at 100% 0%, ${b}, ${a} 62%)"></i>${label}</button>`).join('')}</div>`)}
    ${sec('export', 'Export and backup', exp)}
  </div><div id="savebar-slot"></div>`;
  v.querySelectorAll('details.sec').forEach(el => el.addEventListener('toggle', () => { el.open ? openSecs.add(el.dataset.sec) : openSecs.delete(el.dataset.sec); }));
  v.querySelectorAll('input, select').forEach(el => el.addEventListener('input', () => { readSetup(); showSavebar(); }));
  v.querySelectorAll('input[type=checkbox], select').forEach(el => el.addEventListener('change', () => { readSetup(); showSavebar(); if (el.id.startsWith('d-rev-') || /^g-[tsp]src-/.test(el.id)) renderSetup(); }));
  v.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { readSetup(); addRow(b.dataset.add); renderSetup(); showSavebar(); }));
  v.querySelectorAll('[data-del]').forEach(b => {
    let armed = false;
    b.addEventListener('click', () => {
      if (!armed) { armed = true; b.textContent = 'Tap again to remove'; return; }
      readSetup(); setupDraft[b.dataset.del].splice(+b.dataset.i, 1); renderSetup(); showSavebar();
    });
  });
  v.querySelectorAll('[data-move]').forEach(b => b.addEventListener('click', () => { readSetup(); const i = +b.dataset.move, r = setupDraft.merchantRules; [r[i - 1], r[i]] = [r[i], r[i - 1]]; renderSetup(); showSavebar(); }));
  v.querySelectorAll('[data-rdel]').forEach(b => b.addEventListener('click', () => { readSetup(); setupDraft.merchantRules.splice(+b.dataset.rdel, 1); renderSetup(); showSavebar(); }));
  $('#ex-tx').addEventListener('click', () => exportFile('transactions'));
  $('#bk-save').addEventListener('click', backupNow);
  v.querySelectorAll('[data-theme-pick]').forEach(b => b.addEventListener('click', () => { pref.theme = b.dataset.themePick; lsSet(LS_PREF, pref); applyTheme(); v.querySelectorAll('[data-theme-pick]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  const bkr = $('#bk-restore'); if (bkr) bkr.addEventListener('click', openRestore);
  $('#ex-bal').addEventListener('click', () => exportFile('balances'));
  showSavebar();
}
function addRow(kind) {
  const d = setupDraft;
  if (kind === 'categories') d.categories.push({ id: 'c' + uid8(), name: 'New category', monthlyBudget: 0, type: 'Flexible', essential: false, notes: '' });
  if (kind === 'debts') d.debts.push({ id: 'd' + uid8(), name: 'New debt', balance: 0, balanceAsOf: todayISO(), apr: 0, requiredPayment: 0, dueDay: 1, paymentSource: 'Take-home', isRevolving: false, originalAmount: null, startDate: null, endDate: null, notes: '' });
  if (kind === 'bills') d.bills.push({ id: 'b' + uid8(), name: 'New bill', amount: 0, dueDate: todayISO(), paid: false });
  if (kind === 'savingsAccounts') d.savingsAccounts.push({ id: 'a' + uid8(), name: 'New account', balance: 0, currency: 'JMD', accessible: true, notes: '' });
  if (kind === 'savingsGoals') { d.savingsGoals = d.savingsGoals || []; d.savingsGoals.push({ id: 'g' + uid8(), name: 'New goal', targetFrom: 'manual', savedFrom: 'manual', plannedFrom: 'manual', target: 0, savedSoFar: 0, plannedPerMonth: 0, targetDate: null }); }
  if (kind === 'merchantRules') { d.merchantRules = d.merchantRules || []; d.merchantRules.push({ keyword: '', category: '' }); }
  if (kind === 'payrollDeductions') d.payrollDeductions.push({ id: 'p' + uid8(), name: 'New deduction', monthlyAmount: 0, category: 'Other', deductedBeforeNet: true, notes: '' });
  openSecs.add({ categories: 'cats', debts: 'debts', bills: 'bills', savingsAccounts: 'sav', payrollDeductions: 'payroll', merchantRules: 'rules', savingsGoals: 'goals' }[kind]);
}
function readSetup() {
  const d = setupDraft, s = d.settings;
  const n = id => { const el = document.getElementById(id); if (!el) return undefined; const x = parseFloat(el.value); return isFinite(x) ? x : 0; };
  const t = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const b = id => { const el = document.getElementById(id); return el ? el.checked : undefined; };
  const set = (o, k, val) => { if (val !== undefined) o[k] = val; };
  set(s, 'payFrequency', t('s-freq')); set(s, 'usualPayday', n('s-payday')); set(s, 'netPayPerPeriod', n('s-net')); set(s, 'otherIncome', n('s-other'));
  const pm = t('s-plan'); if (pm) s.planningMonth = pm + '-01';
  set(s, 'cashOnHand', n('s-cash')); set(s, 'cashAsOfDate', t('s-asof'));
  set(s, 'cardHardCeiling', n('s-hard')); set(s, 'cardSoftCeiling', n('s-soft'));
  const cr = n('s-crit'); if (cr !== undefined) s.criticalPct = cr / 100; const wa = n('s-watch'); if (wa !== undefined) s.watchPct = wa / 100;
  set(s, 'monthlyOutsideSavings', n('s-osav')); set(s, 'cashBufferTarget', n('s-buf')); set(s, 'emergencyFundTarget', n('s-ef'));
  set(s, 'payoffMethod', t('s-method')); set(s, 'monthlyExtraPayment', n('s-extra'));
  d.categories.forEach((x, i) => { set(x, 'name', (t('c-name-' + i) || '').trim() || x.name); set(x, 'monthlyBudget', n('c-bud-' + i)); set(x, 'type', t('c-type-' + i)); set(x, 'essential', b('c-ess-' + i)); });
  d.debts.forEach((x, i) => {
    set(x, 'name', (t('d-name-' + i) || '').trim() || x.name); set(x, 'balance', n('d-bal-' + i)); set(x, 'balanceAsOf', t('d-asof-' + i));
    const apr = n('d-apr-' + i); if (apr !== undefined) x.apr = apr / 100;
    set(x, 'requiredPayment', n('d-req-' + i)); set(x, 'dueDay', n('d-due-' + i)); set(x, 'paymentSource', t('d-src-' + i)); set(x, 'isRevolving', b('d-rev-' + i));
    if (document.getElementById('d-orig-' + i)) { x.originalAmount = n('d-orig-' + i) || null; x.startDate = t('d-start-' + i) || null; x.endDate = t('d-end-' + i) || null; }
  });
  d.bills.forEach((x, i) => { set(x, 'name', (t('b-name-' + i) || '').trim() || x.name); set(x, 'amount', n('b-amt-' + i)); set(x, 'dueDate', t('b-due-' + i)); set(x, 'paid', b('b-paid-' + i)); });
  d.savingsAccounts.forEach((x, i) => { set(x, 'name', (t('a-name-' + i) || '').trim() || x.name); set(x, 'balance', n('a-bal-' + i)); set(x, 'currency', t('a-cur-' + i)); set(x, 'accessible', b('a-acc-' + i)); });
  d.payrollDeductions.forEach((x, i) => { set(x, 'name', (t('p-name-' + i) || '').trim() || x.name); set(x, 'monthlyAmount', n('p-amt-' + i)); set(x, 'category', t('p-cat-' + i));
    const less = t('p-less-' + i); if (less !== undefined) x.lessDebtId = less || null; const to = t('p-to-' + i); if (to !== undefined) x.savesTo = to.trim(); });
  set(s, 'emergencyAccountId', t('s-emacct')); const mc = n('s-mincover'); if (mc !== undefined) s.minCoverMonths = mc;
  (d.savingsGoals || []).forEach((g, i) => {
    set(g, 'name', (t('g-name-' + i) || '').trim() || g.name);
    const ts = t('g-tsrc-' + i); if (ts !== undefined) g.targetFrom = ts; const tv = n('g-target-' + i); if (tv !== undefined) g.target = tv;
    const ss = t('g-ssrc-' + i); if (ss !== undefined) g.savedFrom = ss; const sv = n('g-saved-' + i); if (sv !== undefined) g.savedSoFar = sv;
    const ps = t('g-psrc-' + i); if (ps !== undefined) g.plannedFrom = ps; const pv = n('g-plan-' + i); if (pv !== undefined) g.plannedPerMonth = pv;
    const dt = t('g-date-' + i); if (dt !== undefined) g.targetDate = dt || null;
  });
  (d.merchantRules || []).forEach((x, i) => { const kw = t('r-kw-' + i); if (kw !== undefined) x.keyword = kw.trim(); set(x, 'category', t('r-cat-' + i)); });
}
function dirty() { return setupDraft && JSON.stringify(setupDraft) !== JSON.stringify(config()); }
function showSavebar() {
  const slot = document.getElementById('savebar-slot'); if (!slot) return;
  if (!dirty()) { slot.innerHTML = ''; return; }
  if (slot.firstChild) return;
  slot.innerHTML = `<div class="savebar"><div><span>Unsaved changes</span><button class="no" id="sb-no" type="button">Discard</button><button class="go" id="sb-go" type="button">Save</button></div></div>`;
  $('#sb-no').addEventListener('click', () => { setupDraft = null; renderSetup(); });
  $('#sb-go').addEventListener('click', saveSetup);
}
async function saveSetup() {
  readSetup();
  setupDraft.merchantRules = (setupDraft.merchantRules || []).filter(r => r.keyword && r.category);
  const draft = setupDraft, old = config();
  // Renamed categories or debts carry their transactions with them.
  const renames = [];
  for (const c of draft.categories) { const o = old.categories.find(x => x.id === c.id); if (o && o.name !== c.name) renames.push([o.name, c.name]); }
  for (const dd of draft.debts) {
    const o = old.debts.find(x => x.id === dd.id); if (!o) continue;
    if (E.paymentCat(o) !== E.paymentCat(dd)) renames.push([E.paymentCat(o), E.paymentCat(dd)]);
    if (E.interestCat(o) !== E.interestCat(dd)) renames.push([E.interestCat(o), E.interestCat(dd)]);
  }
  const go = $('#sb-go'); if (go) { go.disabled = true; go.textContent = 'Saving…'; }
  try {
    await writeOp({ kind: 'config', config: draft });
    for (const [from, to] of renames) for (const tx of state.transactions.filter(x => x.category === from)) await writeOp({ kind: 'tx-set', tx: { ...tx, category: to } });
    Object.assign(state, JSON.parse(JSON.stringify(draft)));
    setupDraft = null; cacheLocal(); render(); showToast('Setup saved');
  } catch (e) { if (go) { go.disabled = false; go.textContent = 'Save'; } showToast('Could not save. Check your connection and try again.'); }
}

// ---------- misc ----------
let toastT;
function showToast(msg) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { if (g.dataset.go === 'activity') filt = { q: '', cat: '__none', method: '' }; go(g.dataset.go); } });

boot().then(() => { if (location.hash === '#add') { history.replaceState(null, '', '#home'); render(); openTx(null); } });
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
