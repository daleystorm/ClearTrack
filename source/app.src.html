<title>ClearTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one phone column; a coloured summary card on top, compact cards and fold-outs below; fixed tab bar + add button.
   Colour: cool slate neutrals, one theme accent (picked in Setup), a marigold highlight, and a colour per section. */
:root {
  --bg: #f1f3f7; --surface: #ffffff; --surface-2: #e8ebf1; --ink: #141b26; --muted: #5b6474; --line: #d9dee6;
  --accent-ink: #ffffff; --hl: #f2b544; --hero-ink: #ffffff;
  --sec-spend: #d4553a; --sec-plan: #0f8577; --sec-debt: #5b4bd0; --sec-setup: #5b6474; --sec-home: var(--accent);
  --good: #1d7f47; --good-soft: #dbf0e2; --warn: #a8640a; --warn-soft: #f8e7c8; --bad: #b5321c; --bad-soft: #f7ddd7;
  --shadow: 0 1px 2px rgba(20,27,38,.05), 0 6px 18px rgba(20,27,38,.06);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --accent: #1d58a8; --accent-soft: #dfe9f7; --hero1: #14305a; --hero2: #1d58a8;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
:root[data-accent="harbour"] { --accent: #1d58a8; --accent-soft: #dfe9f7; --hero1: #14305a; --hero2: #1d58a8; }
:root[data-accent="seagreen"] { --accent: #0b6a4c; --accent-soft: #d5ebe1; --hero1: #0a3d2e; --hero2: #0b6a4c; }
:root[data-accent="plum"] { --accent: #7b3f9e; --accent-soft: #eedff5; --hero1: #3c1c55; --hero2: #7b3f9e; }
:root[data-accent="graphite"] { --accent: #2f3d52; --accent-soft: #e1e6ee; --hero1: #1b2433; --hero2: #3a4a63; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #0e1218; --surface: #171d26; --surface-2: #212937; --ink: #e6ebf2; --muted: #95a0b2; --line: #2a3342;
  --accent-ink: #0e1218; --hl: #f5c463; --hero-ink: #ffffff;
  --sec-spend: #ff8a6b; --sec-plan: #42c7b5; --sec-debt: #a99bff; --sec-setup: #95a0b2; --sec-home: var(--accent);
  --good: #5ccf8a; --good-soft: #163525; --warn: #f0b04c; --warn-soft: #3a2b12; --bad: #ff8a72; --bad-soft: #3f1d16;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; color-scheme: dark;
  --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
  :root:not([data-theme="light"])[data-accent="harbour"] { --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
  :root:not([data-theme="light"])[data-accent="seagreen"] { --accent: #4fc496; --accent-soft: #15372b; --hero1: #0c2a20; --hero2: #0f5039; }
  :root:not([data-theme="light"])[data-accent="plum"] { --accent: #c99be6; --accent-soft: #2f1d3d; --hero1: #2a1440; --hero2: #5a2d78; }
  :root:not([data-theme="light"])[data-accent="graphite"] { --accent: #a9b8cf; --accent-soft: #222b38; --hero1: #151b25; --hero2: #2b3647; }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #171d26; --surface-2: #212937; --ink: #e6ebf2; --muted: #95a0b2; --line: #2a3342;
  --accent-ink: #0e1218; --hl: #f5c463; --hero-ink: #ffffff;
  --sec-spend: #ff8a6b; --sec-plan: #42c7b5; --sec-debt: #a99bff; --sec-setup: #95a0b2; --sec-home: var(--accent);
  --good: #5ccf8a; --good-soft: #163525; --warn: #f0b04c; --warn-soft: #3a2b12; --bad: #ff8a72; --bad-soft: #3f1d16;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; color-scheme: dark;
  --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
:root[data-theme="dark"][data-accent="harbour"] { --accent: #7fb0f0; --accent-soft: #18294a; --hero1: #10223f; --hero2: #1a3f78; }
:root[data-theme="dark"][data-accent="seagreen"] { --accent: #4fc496; --accent-soft: #15372b; --hero1: #0c2a20; --hero2: #0f5039; }
:root[data-theme="dark"][data-accent="plum"] { --accent: #c99be6; --accent-soft: #2f1d3d; --hero1: #2a1440; --hero2: #5a2d78; }
:root[data-theme="dark"][data-accent="graphite"] { --accent: #a9b8cf; --accent-soft: #222b38; --hero1: #151b25; --hero2: #2b3647; }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 170px }
h1, h2, h3 { margin: 0; text-wrap: balance }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.small { font-size: 13px }
.lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.money { font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 14px }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.02em }
.brand { display: flex; align-items: center; gap: 8px }
.brand span { color: var(--accent); margin-left: -8px }
.brand .logo { width: 28px; height: 28px; flex: none }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }

/* hero: the coloured summary card that opens each screen */
.hero { position: relative; overflow: hidden; margin-bottom: 14px; padding: 18px 18px 18px; border-radius: 22px; color: var(--hero-ink);
  background: radial-gradient(120% 140% at 100% 0%, var(--hero2) 0%, var(--hero1) 62%); box-shadow: 0 10px 28px rgba(15,25,45,.18) }
.hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; border: 28px solid rgba(255,255,255,.06); pointer-events: none }
.hero .lbl { color: rgba(255,255,255,.78) }
.hero .money { font-size: clamp(34px, 11vw, 52px); line-height: 1.05; margin-top: 6px; overflow-wrap: anywhere }
.hero .cur { font-size: .42em; vertical-align: .6em; margin-right: 4px; color: var(--hl); font-weight: 600 }
.hero p { margin: 8px 0 0; color: rgba(255,255,255,.8); font-size: 14px; position: relative; z-index: 1 }
.hero h1 { color: var(--hero-ink) }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; position: relative; z-index: 1 }
.hero-stats a, .hero-stats div { display: block; text-decoration: none; color: inherit; background: rgba(255,255,255,.1); border-radius: 12px; padding: 9px 10px; min-width: 0 }
.hero-stats span { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.72); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hero-stats b { display: block; font-family: var(--f-display); font-weight: 600; font-size: clamp(12.5px, 3.7vw, 15px); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hero-stats b.hl { color: var(--hl) }
.hero .pill { background: rgba(255,255,255,.16); color: #fff }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stack { display: grid; gap: 12px }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0 }
.card h2 { font-size: 15px; font-weight: 600 }
.card .money.m { font-size: 22px; margin-top: 6px; display: block }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.row > :first-child { min-width: 0 }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap }
.pill.green { background: var(--good-soft); color: var(--good) }
.pill.amber { background: var(--warn-soft); color: var(--warn) }
.pill.red { background: var(--bad-soft); color: var(--bad) }
.pill.plain { background: var(--surface-2); color: var(--muted) }

/* card meter */
.meter { position: relative; height: 14px; border-radius: 999px; background: var(--surface-2); margin: 14px 0 6px; overflow: visible }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .45 }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted) }

.list { list-style: none; margin: 10px 0 0; padding: 0 }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line) }
.list li:first-child { border-top: 0 }
.list .main { min-width: 0 }
.list .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.list .s { font-size: 13px; color: var(--muted) }
.amt { font-weight: 600; white-space: nowrap; text-align: right }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500 }
.banner.info { background: var(--accent-soft); color: var(--accent) }
.banner button { margin-left: auto; background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 }

.insight { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px }
.insight b { color: var(--accent) }
.spark { width: 100%; height: 56px; display: block; margin-top: 12px }

details.calc summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); list-style: none }
details.calc summary::-webkit-details-marker { display: none }
.calc table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px }
.calc td { padding: 6px 0; border-top: 1px solid var(--line) }
.calc td:last-child { text-align: right; white-space: nowrap }
.calc tr.total td { font-weight: 700; border-top: 2px solid var(--ink) }

/* tab bar + fab */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 10px; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 600; min-height: 56px; justify-content: center }
.tabs a[data-tab="home"] { --tc: var(--sec-home) } .tabs a[data-tab="activity"] { --tc: var(--sec-spend) } .tabs a[data-tab="plan"] { --tc: var(--sec-plan) }
.tabs a[data-tab="debts"] { --tc: var(--sec-debt) } .tabs a[data-tab="setup"] { --tc: var(--sec-setup) }
.tabs a[aria-current="page"] { color: var(--tc) }
.tabs svg { width: 22px; height: 22px; padding: 0; border-radius: 999px }
.tabs a[aria-current="page"] svg { background: color-mix(in srgb, var(--tc) 16%, transparent); width: 46px; padding: 0 12px; box-sizing: content-box; margin: 0 -12px }
.fab { position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  width: 64px; height: 64px; border-radius: 22px; border: 0; background: var(--hl); color: #1d1606; box-shadow: 0 8px 22px rgba(15,25,45,.28);
  display: grid; place-items: center }
.fab svg { width: 30px; height: 30px }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 18px) } }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,12,.45); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 18px) }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px }
.sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px }
.amount-in { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border-radius: var(--r); padding: 14px 16px; border: 2px solid transparent }
.amount-in:focus-within { border-color: var(--accent) }
.amount-in span { font-family: var(--f-display); color: var(--muted); font-size: 20px }
.amount-in input { border: 0; background: transparent; outline: none; width: 100%; font-family: var(--f-display); font-size: 34px; font-weight: 600; min-width: 0 }
.field { display: grid; gap: 6px; margin-top: 14px }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none }
.in, select.in, textarea.in { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
textarea.in { min-height: 70px; resize: vertical }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chips button { min-height: 40px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500 }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; font-size: 14px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line) }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent) }
.btn { min-height: 52px; border-radius: 14px; border: 0; padding: 0 18px; font-weight: 700; font-size: 16px }
.btn.primary { background: var(--accent); color: var(--accent-ink); width: 100% }
.btn.ghost { background: transparent; color: var(--muted) }
.btn.danger { background: var(--bad-soft); color: var(--bad) }
.btn:disabled { opacity: .45 }
.actions { display: grid; gap: 8px; margin-top: 18px }
.err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 8px }

/* activity */
.search { display: grid; gap: 8px; margin-bottom: 12px }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.month-h { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 6px }
.month-h h2 { font-size: 15px }
.txn { width: 100%; text-align: left; background: none; border: 0; padding: 0; display: flex; justify-content: space-between; gap: 12px; align-items: center }
.cc { color: var(--warn) }
.inc { color: var(--good) }

/* setup */
details.sec { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow) }
details.sec > summary { list-style: none; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600 }
details.sec > summary::-webkit-details-marker { display: none }
details.sec > summary::after { content: "+"; font-size: 20px; color: var(--muted) }
details.sec[open] > summary::after { content: "–" }
.sec-body { padding: 0 16px 16px }
.sec-body .field:first-child { margin-top: 0 }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; display: grid; gap: 10px }
.item .two, .item .three { gap: 8px }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px }
.item .field { margin-top: 0 }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; text-align: left }
.linkbtn.del { color: var(--bad) }
.savebar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); z-index: 22; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.savebar div { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 8px 8px 8px 16px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25) }
.savebar span { flex: 1; font-weight: 600; font-size: 14px }
.savebar button { min-height: 44px; border-radius: 12px; border: 0; padding: 0 16px; font-weight: 700 }
.savebar .go { background: var(--accent); color: var(--accent-ink) }
.savebar .no { background: transparent; color: var(--bg) }
.hint { font-size: 12.5px; color: var(--muted) }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
.empty { text-align: center; padding: 40px 12px; color: var(--muted) }
.sync { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px }
/* phase 2 */
.navseg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 14px }
.navseg a { min-height: 42px; display: grid; place-items: center; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px }
.navseg a[aria-current="page"] { background: var(--surface); color: var(--sec, var(--ink)); box-shadow: var(--shadow) }
body[data-sec="activity"] { --sec: var(--sec-spend) } body[data-sec="plan"] { --sec: var(--sec-plan) } body[data-sec="debts"] { --sec: var(--sec-debt) } body[data-sec="setup"] { --sec: var(--sec-setup) } body[data-sec="home"] { --sec: var(--accent) }
.ghead h2, .month-h h2 { color: var(--sec, var(--ink)) }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1 }
.stepper h1 { font-family: var(--f-display); font-size: 20px; font-weight: 600 }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 12px }
.kv div { min-width: 0 }
.kv b { display: block; font-weight: 600; font-size: 15px; margin-top: 2px }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent) }
.bar span.over { background: var(--bad) }
.prow { padding: 11px 0; border-top: 1px solid var(--line); display: grid; gap: 4px }
.prow:first-child { border-top: 0 }
.prow .row .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ghead { margin: 18px 2px 6px; display: flex; justify-content: space-between; align-items: baseline }
.ghead h2 { font-size: 15px }
.cmp td:nth-child(n+2) { text-align: right; white-space: nowrap }
.cmp td { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px }
.cmp th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; font-weight: 600; padding-bottom: 4px }
.cmp th:first-child { text-align: left }
.dir { font-size: 12px; font-weight: 600 }
.dir.good { color: var(--good) } .dir.bad { color: var(--bad) } .dir.neutral { color: var(--muted) }
.tablewrap { overflow-x: auto; margin-top: 8px }
.tablewrap table { width: 100%; border-collapse: collapse; min-width: 320px }
.chart { position: relative; margin-top: 12px; touch-action: pan-y }

<script>
(function () {
'use strict';
const E = window.CTEngine;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const METHODS = ['Debit/Cash', 'Credit Card', 'Bank Transfer'];
const METHOD_LABEL = { 'Debit/Cash': 'Debit / Cash', 'Credit Card': 'Credit card', 'Bank Transfer': 'Transfer' };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LS_STATE = 'ct.state.v1', LS_OUT = 'ct.outbox.v1', LS_PREF = 'ct.pref.v1';
const STANDALONE = /*STANDALONE*/false; // true in the installable phone build (GitHub Pages)

// ---------- formatting ----------
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso, withYear = true) { if (!iso) return '—'; const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MON[m - 1] + (withYear ? ' ' + y : ''); }
function wd(iso) { const [y, m, d] = iso.split('-').map(Number); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; }
function sym() { return (state && state.settings.currencySymbol) || 'J$'; }
function whole(n) { return sym() + Math.round(n).toLocaleString('en-US'); }
function two(n) { return sym() + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pct(x, d = 1) { return (x * 100).toFixed(d) + '%'; }
function daysUntil(iso) { const a = Date.parse(todayISO() + 'T00:00:00Z'), b = Date.parse(iso + 'T00:00:00Z'); return Math.round((b - a) / 86400000); }
function monthLabel(key) { return MON[+key.slice(4, 6) - 1] + ' ' + key.slice(0, 4); }
function uid8() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- state ----------
let state = null;            // { settings, categories, debts, bills, savingsAccounts, payrollDeductions, merchantRules, transactions }
let mode = 'loading';        // 'cloud' | 'local' | 'loading'
let db = null, userId = null, stateRef = null, txCol = null;
let txServer = [];           // transactions from the store
let outbox = lsGet(LS_OUT, []);
let pref = lsGet(LS_PREF, { method: 'Credit Card' });
const THEMES = [['harbour', 'Harbour', '#14305a', '#1d58a8'], ['seagreen', 'Sea green', '#0a3d2e', '#0b6a4c'], ['plum', 'Plum', '#3c1c55', '#7b3f9e'], ['graphite', 'Graphite', '#1b2433', '#3a4a63']];
function applyTheme() { try { document.documentElement.dataset.accent = pref.theme || 'harbour'; } catch (e) {} }
// ---------- phone notifications (installed app only) ----------
// The page writes the upcoming reminders to the app's own cache; the service worker reads them in a daily
// background check (Chrome decides exactly when) and whenever the app is opened, and shows Android notifications.
const NOTIFY_OK = STANDALONE && 'Notification' in window && 'serviceWorker' in navigator && 'caches' in window;
let remJson = '', remTimer = null;
function reminderPayload() {
  if (!calc) return null;
  const items = E.reminders(state, todayISO(), calc, 31).map(it => ({
    key: it.kind + ':' + (it.id || it.month || it.title) + ':' + it.date, kind: it.kind, date: it.date, title: it.title,
    amount: it.amount || 0, covered: !!it.covered, payroll: !!it.payroll, label: it.month ? shortMonth(it.month) : '' }));
  const today = todayISO(), mk = E.monthKey(today);
  for (const al of E.budgetAlerts(state, today)) items.push({ key: 'budget:' + al.name + ':' + mk + ':' + al.level, kind: 'budget', once: true, date: today, title: catLabel(al.name), amount: al.actual, budget: al.budget, level: al.level });
  for (const r of E.recurringStatus(state, today)) if (!r.logged && !r.auto) items.push({ key: 'recurring:' + r.id + ':' + r.date, kind: 'recurring', date: r.date, title: r.description, amount: +r.amount });
  const ro = E.rolloverDue(state, today); if (ro) items.push({ key: 'rollover:' + ro.payday, kind: 'rollover', once: true, date: today, title: 'Start the new pay cycle', label: shortMonth(ro.fundMonth) });
  return { sym: sym(), items, lastBackup: pref.lastBackup || null, hasData: !!(state.transactions.length || state.debts.length) };
}
async function syncReminders() {
  if (!NOTIFY_OK) return;
  const p = reminderPayload(); if (!p) return;
  const json = JSON.stringify(p); if (json === remJson) return; remJson = json;
  try { const c = await caches.open('cleartrack-data'); await c.put('./reminders.json', new Response(json, { headers: { 'content-type': 'application/json' } })); } catch (e) {}
}

  await syncReminders(); swMessage({ type: 'check' });
}
async function registerBackgroundCheck() {
  try {
    const r = await navigator.serviceWorker.ready;
    if (!('periodicSync' in r)) return 'unsupported';
    const st = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => ({ state: 'denied' }));
    if (st.state !== 'granted') return 'not-allowed';
    await r.periodicSync.register('ct-reminders', { minInterval: 12 * 60 * 60 * 1000 }); return 'on';
  } catch (e) { return 'unsupported'; }
}

  if (!NOTIFY_OK) return;
  let perm = Notification.permission;
  if (perm !== 'granted') perm = await Notification.requestPermission();
  if (perm !== 'granted') { pref.notify = false; lsSet(LS_PREF, pref); showToast(perm === 'denied' ? 'Notifications are blocked. Allow them in Android Settings → Apps → ClearTrack.' : 'Notifications not turned on'); renderSetup(); return; }
  pref.notify = true; pref.bgCheck = await registerBackgroundCheck(); lsSet(LS_PREF, pref);
  await syncReminders(); swMessage({ type: 'test' }); buzz('success'); renderSetup();
}
async function turnOffNotifications() {
  pref.notify = false; lsSet(LS_PREF, pref);
  try { const r = await navigator.serviceWorker.ready; if (r.periodicSync) await r.periodicSync.unregister('ct-reminders'); } catch (e) {}
  showToast('Notifications off'); renderSetup();
}
function notifySetupHtml() {
  const vib = `<label class="toggle" for="hp-on"><span>Vibrate on taps and warnings</span><input type="checkbox" id="hp-on"${pref.haptics === false ? '' : ' checked'}></label>`;
  if (!STANDALONE) return vib + '<p class="hint" style="margin:10px 0 0">Phone notifications are available in the installed ClearTrack app.</p>';
  if (!NOTIFY_OK) return vib + '<p class="hint" style="margin:10px 0 0">This browser can’t show notifications.</p>';
  const perm = Notification.permission, on = pref.notify && perm === 'granted';
  const bg = { on: 'Daily background check is on. Chrome picks the exact time, usually once a day if you use the app regularly.', 'not-allowed': 'Background checks aren’t allowed yet, so you’ll get alerts when you open the app. Using the app daily from your home screen usually lets Chrome turn them on; tap “Turn on” again later to retry.', unsupported: 'This phone’s Chrome doesn’t offer background checks, so alerts come when you open the app.' }[pref.bgCheck] || '';
  return `${vib}
    <p class="hint" style="margin:12px 0 0">Get alerts for bills and debt payments due within 3 days, payday, month-end balances and backups.</p>
    ${on ? `<p class="small" style="margin:8px 0 0"><span class="pill green">On</span> ${bg}</p>
      <div class="actions"><button class="btn" style="background:var(--surface);border:1px solid var(--line)" type="button" id="nt-test">Send a test notification</button><button class="btn ghost" type="button" id="nt-off">Turn off notifications</button></div>`
    : perm === 'denied' ? `<p class="warnline">Notifications are blocked for ClearTrack. Allow them in Android Settings → Apps → ClearTrack → Notifications, then come back here.</p>`
    : `<div class="actions"><button class="btn primary" type="button" id="nt-on">Turn on notifications</button></div>`}`;
}

// Pay that lands late in a month funds the next month: log it on the 1st of the month it pays for.
function payFundsNext() { return state.settings.payFundsNextMonth !== false; }
function payEntryFor(paydayIso) {
  const fund = payFundsNext() ? E.edate(E.monthStart(paydayIso), 1) : E.monthStart(paydayIso);
  const date = payFundsNext() ? fund : paydayIso;
  const m = s => MON[+s.slice(5, 7) - 1];
  return { date, fundMonth: fund, description: payFundsNext() ? `Salary - ${m(paydayIso)} pay (for ${m(fund)})` : `Salary - ${m(paydayIso)} pay`,
    notes: `Received ${fmtDate(paydayIso)}` + (payFundsNext() ? `. Dated ${fmtDate(fund)} because it funds ${m(fund)} spending.` : '') };
}
function payLoggedFor(fundMonth) { const k = E.monthKey(fundMonth); return state.transactions.some(t => t.category === 'Net Pay' && t.date && E.monthKey(t.date) === k); }
// ---------- recurring transactions & description suggestions ----------
function descSuggestions() {
  const seen = new Set(), out = [];
  for (const t of state.transactions.slice().sort((a, b) => a.date < b.date ? 1 : -1)) { const d = String(t.description || '').trim(); if (d && !seen.has(d.toLowerCase())) { seen.add(d.toLowerCase()); out.push(d); } if (out.length >= 80) break; }
  return out;
}
async function logRecurring(r, quiet) {
  const tx = { id: 't' + uid8(), date: r.date, description: r.description, category: r.category, amount: +r.amount, paymentMethod: r.paymentMethod || 'Credit Card', essential: !!r.essential, notes: 'Monthly' + (r.auto ? ' (logged automatically)' : '') };
  await writeOp({ kind: 'tx-set', tx });
  await saveConfig(cfg => { const x = (cfg.recurring || []).find(y => y.id === r.id); if (x) x.lastMonth = E.monthKey(r.date); });
  if (!quiet) { buzz('success'); showToast('Logged ' + r.description + ' · ' + whole(r.amount)); }
  return tx;
}
let autoLogging = false;
async function autoLogRecurring() {
  if (autoLogging || !state || !(state.recurring || []).length) return;
  const due = E.recurringStatus(state, todayISO()).filter(r => r.due && r.auto);
  if (!due.length) return;
  autoLogging = true;
  try { for (const r of due) await logRecurring(r, true); showToast('Logged ' + due.length + ' monthly item' + (due.length === 1 ? '' : 's') + ': ' + due.map(r => r.description).join(', ')); render(); }
  catch (e) {} finally { autoLogging = false; }
}

// Haptics: a short tap for done, a gentle double for success, a firmer double for warnings. Follows the phone's vibration setting.
function buzz(kind) {
  if (pref.haptics === false) return;
  try { if (navigator.vibrate) navigator.vibrate(kind === 'warn' ? [35, 70, 35] : kind === 'success' ? [12, 60, 18] : 12); } catch (e) {}
}
applyTheme();
let syncNote = '';

const BLANK = {
  settings: { planningMonth: todayISO().slice(0, 8) + '01', usualPayday: 28, payFrequency: 'Monthly', netPayPerPeriod: 0, otherIncome: 0,
    cashOnHand: 0, cashAsOfDate: todayISO(), cardHardCeiling: 0, cardSoftCeiling: 0, criticalPct: 0.975, watchPct: 0.85,
    monthlyOutsideSavings: 0, cashBufferTarget: 0, emergencyFundTarget: 0, payoffMethod: 'Avalanche', monthlyExtraPayment: 0, currencySymbol: 'J$' },
  categories: [], debts: [], bills: [], savingsAccounts: [], payrollDeductions: [], merchantRules: [], savingsGoals: [], weeklyCheckIns: [], paydayChecklists: {}, monthSnapshots: [], recurring: []
};
function withIds(s) {
  s.categories = (s.categories || []).map((c, i) => ({ id: c.id || 'c' + uid8(), ...c }));
  s.debts = (s.debts || []).map(d => ({ ...d, id: d.id || 'd' + uid8() }));
  s.bills = (s.bills || []).map(b => ({ ...b, id: b.id || 'b' + uid8() }));
  s.savingsAccounts = (s.savingsAccounts || []).map(a => ({ ...a, id: a.id || 'a' + uid8() }));
  s.payrollDeductions = (s.payrollDeductions || []).map(p => ({ ...p, id: p.id || 'p' + uid8() }));
  s.savingsGoals = (s.savingsGoals || []).map(g => ({ ...g, id: g.id || 'g' + uid8() }));

}
function config() { const { transactions, ...rest } = state; return rest; }
function allTransactions() {
  // store rows, plus queued offline adds/edits, minus queued deletes
  const map = new Map(txServer.map(t => [t.id, t]));
  for (const op of outbox) {
    if (op.kind === 'tx-set') map.set(op.tx.id, op.tx);
    if (op.kind === 'tx-del') map.delete(op.id);
  }
  return [...map.values()];
}
function refreshTx() { state.transactions = allTransactions(); cacheLocal(); }
function cacheLocal() { if (state) lsSet(LS_STATE, state); }

// ---------- categories ----------
function systemCategories() {
  const out = [{ name: 'Net Pay', essential: true }];
  for (const d of state.debts) out.push({ name: E.paymentCat(d), essential: true });
  out.push({ name: 'Extra Credit Card Payment', essential: true }, { name: 'Outside Savings', essential: true }, { name: 'Card Interest', essential: true });
  for (const d of state.debts) if (!d.isRevolving) out.push({ name: E.interestCat(d), essential: true });
  return out;
}
// Friendly names for system categories; the stored category stays the same.
function catLabel(name) {
  if (name === 'Outside Savings') { const em = state && E.emergencyAccount(state); return 'Savings → ' + (em ? em.name.replace(/\s*\(.*\)\s*$/, '') : 'emergency fund'); }
  return name;
}
function allCategories() { const seen = new Set(); return [...state.categories.map(c => ({ name: c.name, essential: !!c.essential })), ...systemCategories()].filter(c => !seen.has(c.name) && seen.add(c.name)); }
function catsByUse() {
  const counts = {}; for (const t of state.transactions) if (t.category) counts[t.category] = (counts[t.category] || 0) + 1;
  return allCategories().map((c, i) => ({ ...c, n: counts[c.name] || 0, i })).sort((a, b) => b.n - a.n || a.i - b.i);
}

// ---------- persistence ----------
async function writeOp(op) {
  if (mode !== 'cloud') { applyLocal(op); return; }
  try {
    await runOp(op);
  } catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted' || !e.code)) {
      outbox.push(op); lsSet(LS_OUT, outbox); syncNote = 'Saved on this device. It will sync when you are back online.';
      refreshTx(); render(); return;
    }
    throw e;
  }
}
function runOp(op) {
  if (op.kind === 'tx-set') return txCol.doc(op.tx.id).set(op.tx);
  if (op.kind === 'tx-del') return txCol.doc(op.id).delete();
  if (op.kind === 'config') return stateRef.set(op.config);
}
function applyLocal(op) {
  if (op.kind === 'tx-set') { const i = state.transactions.findIndex(t => t.id === op.tx.id); if (i >= 0) state.transactions[i] = op.tx; else state.transactions.push(op.tx); }
  if (op.kind === 'tx-del') state.transactions = state.transactions.filter(t => t.id !== op.id);
  if (op.kind === 'config') Object.assign(state, op.config);
  cacheLocal();
}
let flushing = false;
async function flushOutbox() {
  if (mode !== 'cloud' || flushing || !outbox.length) return;
  flushing = true;
  try {
    while (outbox.length) { await runOp(outbox[0]); outbox.shift(); lsSet(LS_OUT, outbox); }
    syncNote = ''; render();
  } catch (e) { /* stay queued; try again later */ }
  flushing = false;
}
window.addEventListener('online', flushOutbox);

// ---------- boot ----------
async function boot() {
  const cached = lsGet(LS_STATE, null);
  if (cached) { state = withIds(cached); render(); }
  if (STANDALONE) {
    if (lockEnabled()) showLock(); else unlocked = true;
    mode = 'local';
    if (!state) state = withIds(JSON.parse(JSON.stringify({ ...BLANK, transactions: [] })));
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    render();
    setTimeout(checkOnOpen, 1500);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); setTimeout(checkOnOpen, 800); } });
    return;
  }
  const claude = window.claude;
  const [dbNs, userNs] = claude && claude.use ? await Promise.all([claude.use('db'), claude.use('user')]) : [null, null];
  db = dbNs; userId = userNs ? await userNs.id() : null;
  if (!db || !userId) {
    mode = 'local';
    if (!state) state = withIds(JSON.parse(JSON.stringify({ ...BLANK, transactions: [] })));
    syncNote = 'Not signed in here, so your entries stay on this device only.';
    render(); return;
  }
  mode = 'cloud';
  stateRef = db.doc('data/users/' + userId + '/state');
  txCol = stateRef.collection('tx');
  const isOwner = await userNs.isOwner();
  let gotState = false, gotTx = false;
  const slow = setTimeout(() => { if (!gotState) { syncNote = 'Can’t reach your saved data yet. Showing what is on this device.'; if (!state) { state = withIds(JSON.parse(JSON.stringify({ ...BLANK, transactions: [] }))); } render(); } }, 10000);
  let seeding = false;
  stateRef.onSnapshot(async snap => {
    if (snap.exists) {
      gotState = true; clearTimeout(slow);
      const cfg = JSON.parse(JSON.stringify(snap.data()));
      state = withIds({ ...BLANK, ...cfg, settings: { ...BLANK.settings, ...(cfg.settings || {}) }, transactions: allTransactions() });
      if (!snap.metadata.fromCache && syncNote.startsWith('Can’t')) syncNote = '';
      cacheLocal(); render(); flushOutbox();
    } else if (!snap.metadata.fromCache && !seeding) {
      seeding = true; gotState = true; clearTimeout(slow);
      await firstRun(isOwner);
    }
  }, err => { clearTimeout(slow); syncNote = 'Your saved data is unavailable right now. Changes stay on this device.'; mode = 'local'; if (!state) state = withIds(JSON.parse(JSON.stringify({ ...BLANK, transactions: [] }))); render(); });
  txCol.onSnapshot(snap => {
    gotTx = true;
    txServer = snap.docs.map(d => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) }));
    if (state) { refreshTx(); render(); }
  }, () => {});
}

async function firstRun(isOwner) {
  // Import the owner-only workbook seed into this person's private space, once.
  let seed = null;
  if (isOwner) { try { const s = await db.doc('seed/workbook').get(); if (s.exists) seed = JSON.parse(JSON.stringify(s.data())); } catch (e) {} }
  const local = lsGet(LS_STATE, null);
  const base = seed || (local && local.settings ? local : null) || { ...BLANK, transactions: [] };
  const s = withIds(JSON.parse(JSON.stringify(base)));
  const txs = (base.transactions || []).map(t => ({ ...t, id: t.id || 't' + uid8() }));
  state = { ...s, transactions: txs };
  render();
  try {
    showToast(seed ? 'Importing your workbook data…' : 'Setting up…');
    const { transactions, ...cfg } = state;
    await stateRef.set(cfg);
    for (const t of txs) await txCol.doc(t.id).set(t);
    showToast(seed ? 'Workbook data imported' : 'Ready');
  } catch (e) { syncNote = 'Could not save your starting data. Try reopening the app.'; render(); }
}

// ---------- routing ----------
function route() { const h = (location.hash || '#home').slice(1); return ['home', 'activity', 'plan', 'savings', 'payday', 'weekly', 'debts', 'payoff', 'setup'].includes(h) ? h : 'home'; }
window.addEventListener('hashchange', () => { if (location.hash === '#add') { history.replaceState(null, '', '#home'); render(); openTx(null); return; } setupDraft = null; render(); window.scrollTo(0, 0); });

// ---------- navigation & the Android back button ----------
// Moving between screens replaces the history entry instead of adding one, so Back never replays old taps.
// Leaving Home adds exactly one entry, so Back from any screen returns Home, and Back on Home leaves the app.
// An open sheet (Quick Add, import, check-in…) adds one entry of its own, so Back closes the sheet first.
function go(to) {
  to = String(to || 'home').replace(/^#/, '');
  if (!STANDALONE) { location.hash = to; return; }
  const from = route();
  if (from === to) { window.scrollTo(0, 0); return; }
  try {
    if (from === 'home' && to !== 'home') history.pushState({ screen: to }, '', '#' + to);
    else if (to === 'home' && history.state && history.state.screen) { history.back(); return; }
    else history.replaceState(history.state, '', '#' + to);
  } catch (e) { location.hash = to; return; }
  setupDraft = null; render(); window.scrollTo(0, 0);
}
let sheetPushed = false, closingByPop = false;
if (STANDALONE) {
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a || e.defaultPrevented) return;
    e.preventDefault(); go(a.getAttribute('href'));
  });
  new MutationObserver(() => {
    const open = !!$('#layer').firstChild;
    if (open && !sheetPushed) { sheetPushed = true; try { history.pushState({ sheet: true, screen: history.state && history.state.screen }, '', location.hash || '#home'); } catch (e) {} }
    else if (!open && sheetPushed) { sheetPushed = false; if (!closingByPop) { try { history.back(); } catch (e) {} } closingByPop = false; }
  }).observe(document.getElementById('layer'), { childList: true });
  window.addEventListener('popstate', () => {
    if (sheetPushed) { closingByPop = true; $('#layer').innerHTML = ''; return; }
    setupDraft = null; render(); window.scrollTo(0, 0);
  });
}

// ---------- month comparison (R20) ----------

  const m = state.settings.planningMonth; if (!m) return '';

  let text;
  if (c.status === 'no prior data') text = `No transactions logged for ${prev}, so the month-over-month comparison starts once both months have data.`;
  else if (c.status === 'not logged yet') text = `No spending or debt payments logged for ${cur} yet. The comparison with ${prev} fills in as you log transactions.`;
  else {
    const sp = c.rows.find(x => x.metric === 'Total Spend'), dp = c.rows.find(x => x.metric === 'Debt Payments');
    text = `${cur} so far: ${whole(sp.current)} spent (${sp.direction} ${whole(Math.abs(sp.change))} on ${prev}) and ${whole(dp.current)} paid to debt.`;
  }
  return `<section class="card"><div class="row"><h2>This month vs last</h2><a class="small" href="#plan" style="color:var(--accent);font-weight:600;text-decoration:none">Plan →</a></div><p class="small muted" style="margin:6px 0 0">${text}</p></section>`;
}

function compareCard(monthIso) {

    const cls = r.good === true ? 'good' : r.good === false ? 'bad' : 'neutral';
    return `<tr><td>${r.metric}</td><td>${whole(r.current)}</td><td>${whole(r.previous)}</td><td><span class="dir ${cls}">${DIR_TXT[r.direction]}</span></td></tr>`;

// ---------- Monthly Plan (S4) ----------

  };

  </div></details>`;

let trendData = null;

  const xt = [all[0], all[Math.floor((all.length - 1) / 2)], all[all.length - 1]].filter((p, i, a) => a.indexOf(p) === i).map((p, k, arr) => `<text x="${x(p.date)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === arr.length - 1 ? 'end' : 'middle'}" font-size="10.5" fill="var(--muted)">${shortMonth(p.date.slice(0, 8) + '01')}</text>`).join('');

    <div class="legend"><span><i style="background:var(--s1)"></i>Recorded total</span><span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px)"></i>Projected (${state.settings.payoffMethod}, ${whole(+state.settings.monthlyExtraPayment || 0)} extra)</span></div>`;
}

function payoffChart(p, debts) {

  const xt = [0, Math.round(n / 2), n].filter((v, i, a) => a.indexOf(v) === i).map((i, k, arr) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === arr.length - 1 ? 'end' : 'middle'}" font-size="10.5" fill="var(--muted)">${shortMonth(rows[i].date)}</text>`).join('');
  const lines = debts.map((d, j) => {
    const col = `var(--s${(j % 5) + 1})`;
    const path = rows.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r.balances[j]).toFixed(1)).join(' ');
    const zero = rows.findIndex(r => r.balances[j] <= 0);
    const dot = zero > 0 ? `<circle cx="${x(zero)}" cy="${y(0)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>` : '';
    return `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dot}`;
  }).join('');
  chartData = { rows, debts, x, n, L, pw, W };
  return `<div class="chart" id="po-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Each debt's projected balance by month until it reaches zero">
      ${grid}${xt}${lines}<line id="po-cross" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" id="po-hit"/></svg>
      <div class="tip" id="po-tip" hidden></div></div>
    <div class="legend">${debts.map((d, j) => { const z = rows.findIndex(r => r.balances[j] <= 0); return `<span><i style="background:var(--s${(j % 5) + 1})"></i>${esc(d.name)}${z > 0 ? ' · cleared ' + shortMonth(rows[z].date) : ''}</span>`; }).join('')}</div>`;
}

function wireChart() {

// ---------- spending insight & budget alerts ----------
let insightOpen = true;
function spendingOverview() {
  const today = todayISO(), mk = E.monthKey(today), prevMk = E.monthKey(E.edate(E.monthStart(today), -1));
  const byCat = {}; let total = 0;
  for (const t of state.transactions) if (t.date && E.monthKey(t.date) === mk && E.flowType(t, state) === 'Expense') { byCat[t.category || 'No category'] = (byCat[t.category || 'No category'] || 0) + +t.amount; total += +t.amount; }
  const prev = E.monthFlows(state, prevMk)['Total Spend'];
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const top = rows.slice(0, 6), rest = rows.slice(6).reduce((a, r) => a + r[1], 0);
  if (rest > 0) top.push(['Everything else', rest]);
  const max = Math.max(1, ...top.map(r => r[1]));
  const budgets = Object.fromEntries(state.categories.map(c => [c.name, +c.monthlyBudget || 0]));
  const bars = top.map(([name, v]) => { const b = budgets[name], over = b > 0 && v > b;
    return `<div class="hbar"><div class="row small"><span class="t">${esc(catLabel(name))}</span><span><b>${whole(v)}</b>${b > 0 ? `<span class="muted"> / ${shortMoney(b)}</span>` : ''}</span></div>
      <div class="bar" style="margin-top:4px"><span class="${over ? 'over' : ''}" style="width:${v / max * 100}%"></span></div></div>`; }).join('');
  // last 6 months of spending
  const months = []; for (let i = 5; i >= 0; i--) { const m = E.edate(E.monthStart(today), -i); months.push([m, E.monthFlows(state, E.monthKey(m))['Total Spend']]); }
  const mmax = Math.max(1, ...months.map(x => x[1]));
  const trend = `<div class="trend" role="img" aria-label="Spending over the last six months">${months.map(([m, v], i) => `<div class="tcol"><span class="tv">${v ? shortMoney(v) : ''}</span><div class="tb"><i style="height:${Math.max(v / mmax * 100, v ? 3 : 0)}%" class="${i === 5 ? 'cur' : ''}"></i></div><span class="tl">${MON[+m.slice(5, 7) - 1]}</span></div>`).join('')}</div>`;
  const change = prev ? `${total > prev ? '▲' : '▼'} ${whole(Math.abs(total - prev))} vs all of ${MON[+prevMk.slice(4) - 1]}` : '';
  return `<details class="fold" id="insight"${insightOpen ? ' open' : ''} style="margin-bottom:12px"><summary><div class="row"><h2>${MON[+mk.slice(4) - 1]} so far</h2><span class="small muted">${whole(total)} spent</span></div>${change ? `<div class="small muted" style="margin-top:2px">${change}</div>` : ''}</summary>
    <div class="fold-body">${bars || '<p class="small muted">No spending logged this month yet.</p>'}
      <div class="lbl" style="margin:14px 0 6px">Last 6 months</div>${trend}<div style="height:10px"></div></div></details>`;
}
function budgetBanner() {
  const al = E.budgetAlerts(state, todayISO()); if (!al.length) return '';
  const over = al.filter(a => a.level === 'over'), near = al.filter(a => a.level === 'near');
  const txt = over.length ? `${over.length} categor${over.length === 1 ? 'y is' : 'ies are'} over budget this month${near.length ? `, ${near.length} close` : ''}: ${over.slice(0, 2).map(a => esc(catLabel(a.name))).join(', ')}${over.length > 2 ? '…' : ''}`
    : `${near.length} categor${near.length === 1 ? 'y is' : 'ies are'} past 80% of budget: ${near.slice(0, 2).map(a => esc(catLabel(a.name))).join(', ')}`;
  return `<div class="banner${over.length ? '' : ' info'}"><span>${txt}</span><button data-go="plan">See plan</button></div>`;
}

// ---------- app lock (PIN, with optional fingerprint) ----------
const LS_LOCK = 'ct.lock.v1';
let lockCfg = lsGet(LS_LOCK, null), hiddenAt = 0, unlocked = false;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function hashPin(pin, salt) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return b64(d); }
function lockEnabled() { return STANDALONE && lockCfg && lockCfg.pinHash; }
async function fingerprintUnlock() {
  if (!lockCfg || !lockCfg.credId) return false;
  try { await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(lockCfg.credId) }], userVerification: 'required', timeout: 60000 } }); return true; }
  catch (e) { return false; }
}
function showLock() {
  if (!lockEnabled()) return;
  unlocked = false;
  let el = document.getElementById('lock');
  if (!el) { el = document.createElement('div'); el.id = 'lock'; document.body.appendChild(el); }
  el.innerHTML = `<div class="lock-in"><svg class="logo" viewBox="0 0 84 84" aria-hidden="true" style="width:64px;height:64px"><rect width="84" height="84" rx="19" fill="var(--hero1)"/><path d="M59 22 A24 24 0 1 0 59 62" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M32 42 L42 52 L64 28" fill="none" stroke="var(--hl)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 style="margin:14px 0 4px">ClearTrack is locked</h2><p class="small muted" style="margin:0 0 16px">Enter your PIN${lockCfg.credId ? ' or use your fingerprint' : ''}.</p>
    <form id="lock-form" novalidate><input class="in" id="lock-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN" style="text-align:center;font-size:24px;letter-spacing:.3em;max-width:220px">
    <div class="err" id="lock-err" hidden></div>
    <div class="actions" style="max-width:260px;margin-inline:auto"><button class="btn primary" type="submit">Unlock</button>${lockCfg.credId ? '<button class="btn" type="button" id="lock-fp" style="background:var(--surface);border:1px solid var(--line)">Use fingerprint</button>' : ''}<button class="btn ghost" type="button" id="lock-forgot">Forgot PIN?</button></div></form></div>`;
  el.hidden = false; document.documentElement.classList.add('locked');
  const done = () => { unlocked = true; el.hidden = true; el.innerHTML = ''; document.documentElement.classList.remove('locked'); buzz('tap'); };
  $('#lock-form').addEventListener('submit', async e => {
    e.preventDefault(); const pin = $('#lock-pin').value;
    if (await hashPin(pin, lockCfg.salt) === lockCfg.pinHash) done();
    else { const er = $('#lock-err'); er.textContent = 'That PIN isn’t right.'; er.hidden = false; buzz('warn'); $('#lock-pin').value = ''; }
  });
  const fp = $('#lock-fp'); if (fp) { fp.addEventListener('click', async () => { if (await fingerprintUnlock()) done(); }); setTimeout(async () => { if (!unlocked && document.visibilityState === 'visible' && await fingerprintUnlock()) done(); }, 300); }
  let armed = false;
  $('#lock-forgot').addEventListener('click', () => {

// ---------- reminders (Phase 3) ----------
let showAllComing = false;
function comingUp() {

  if (backupDue()) items.unshift({ kind: 'backup', date: todayISO(), days: 0, title: 'Back up your data' });
  const ro = E.rolloverDue(state, todayISO()); if (ro) items.push({ kind: 'rollover', date: todayISO(), days: 0, title: 'Start the ' + shortMonth(ro.fundMonth) + ' cycle' });
  for (const r of E.recurringStatus(state, todayISO())) if (!r.logged && !r.auto && daysUntil(r.date) <= 7) items.push({ kind: 'recurring', id: r.id, date: r.date, days: daysUntil(r.date), title: r.description, amount: +r.amount, due: r.due });
  items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const total = items.length; if (!showAllComing) items.splice(4);
  const li = items.map(it => {
    const n = it.days, hot = it.kind === 'bill' ? it.overdue || n <= 3 : it.kind === 'due' ? !it.covered && n <= 3 : n <= 1;
    const whenTxt = n < 0 ? Math.abs(n) + ' days late' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days';
    let detail = '', action = '';
    if (it.kind === 'payday') { detail = `${wd(it.date)} · ${whenTxt}`; action = `<a class="mini" href="#payday" style="display:inline-grid;place-items:center;text-decoration:none;color:inherit">Checklist</a>`; }
    if (it.kind === 'due') detail = `${whole(it.amount)} · ${whenTxt} · ${it.payroll ? 'deducted from pay' : it.covered ? 'payment logged' : it.paid > 0 ? whole(it.paid) + ' logged so far' : 'not logged yet'}`;
    if (it.kind === 'rollover') { detail = 'Payday’s here: move the plan on and update cash'; action = `<button class="mini" type="button" data-rollover="1">Start</button>`; }
    if (it.kind === 'recurring') { detail = `${whole(it.amount)} · monthly · ${it.due ? (it.days < 0 ? 'was due ' + fmtDate(it.date, false) : 'due today') : whenTxt}`; action = it.due ? `<button class="mini" type="button" data-reclog="${esc(it.id)}">Log</button>` : ''; }
    if (it.kind === 'backup') { detail = pref.lastBackup ? `Last one ${fmtDate(pref.lastBackup, false)} · data lives only here` : 'Your data lives only on this phone'; action = `<button class="mini" type="button" data-backup="1">Back up</button>`; }
    if (it.kind === 'snapshot') { detail = `Statement balances for ${shortMonth(it.month)}`; action = `<button class="mini" type="button" data-snap="${esc(it.month)}">Record</button>`; }
    if (it.kind === 'bill') { detail = `${whole(it.amount)} · ${it.overdue ? '<b style="color:var(--bad)">' + whenTxt + '</b>' : whenTxt} `; action = `<button class="mini" type="button" data-billpaid="${esc(it.id)}">Mark paid</button>`; }
    return `<div class="rem"><div class="when${hot ? ' hot' : ''}"><b>${+it.date.slice(8)}</b><span>${MON[+it.date.slice(5, 7) - 1]}</span></div>
      <div class="main"><div class="t">${esc(it.title)}</div><div class="s">${detail}</div></div>${action}</div>`;
  }).join('');
  return `<section class="card"><div class="row"><h2>Coming up</h2>${total > 4 ? `<button class="linkbtn" type="button" id="cu-all" style="padding:0">${showAllComing ? 'Show less' : 'All ' + total}</button>` : ''}</div><div style="margin-top:6px">${li}</div></section>`;
}
document.addEventListener('click', async e => {

// ---------- CSV export (N4) ----------
async function exportFile(kind) {

async function saveFile(filename, data, mime) {
  // Returns true when the file was handed over.
  if (STANDALONE) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: mime }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); showToast('Saved ' + filename + ' to Downloads'); return true;
    } catch (e) { openCopy(filename, data); return false; }
  }
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (!dl) { openCopy(filename, data); return false; }
  try { await dl.save({ filename, data }); showToast('Saved ' + filename); return true; }
  catch (e) {
    if (e && e.code === 'declined') return false;
    if (e && e.code === 'rate_limited') { showToast('A save is already open. Finish it first.'); return false; }
    openCopy(filename, data); return false;
  }
}

let imp = null;
function guessCols(rows) {
  const first = rows[0] || [];
  const header = first.length >= 2 && !E.parseStatementDate(first[0]) && E.parseAmount(first[first.length - 1]) == null;
  const h = header ? first.map(x => String(x).toLowerCase()) : [];
  const find = re => h.findIndex(x => re.test(x));
  let date = find(/date/), desc = find(/desc|detail|narr|merchant|particular|payee|transaction|reference/), amount = find(/amount|amt|value/);
  const debit = find(/debit|withdraw|charge/), credit = find(/credit|deposit|payment/);
  if (date < 0) date = 0; if (desc < 0) desc = Math.min(1, first.length - 1);
  if (amount < 0 && debit < 0) amount = Math.min(2, first.length - 1);
  return { header, date, desc, amount, debit: amount < 0 ? debit : -1, credit: amount < 0 ? credit : -1 };
}

    <div class="counts"><span class="pill green">${count('Ready')} ready</span><span class="pill amber">${count('Pick a category')} need a category</span><span class="pill plain">${count('Already logged')} already logged</span>${count('Fix date / amount') ? `<span class="pill red">${count('Fix date / amount')} unreadable</span>` : ''}</div>
    <details class="calc"><summary>Columns${c.header ? ' (header row skipped)' : ''}</summary><div class="two" style="margin-top:10px">${colSel('ic-date', 'Date', c.date)}${colSel('ic-desc', 'Description', c.desc)}</div>
      <div class="two" style="margin-top:10px">${colSel('ic-amt', 'Amount', c.amount, true)}${c.amount < 0 ? colSel('ic-deb', 'Money out', c.debit) : ''}</div>${c.amount < 0 ? `<div style="margin-top:10px">${colSel('ic-cre', 'Money in', c.credit, true)}</div>` : ''}
      <label class="toggle" style="margin-top:10px" for="ic-head"><span>First row is a header</span><input type="checkbox" id="ic-head"${c.header ? ' checked' : ''}></label></details>
    <section class="card" style="padding-block:2px;margin-top:10px">${list}</section>
    <p class="hint">Rows already logged (same date and amount) are left out unless you tick them.</p>
    <div class="actions"><button class="btn primary" type="button" id="im-go"${nAdd ? '' : ' disabled'}>Add ${nAdd} transaction${nAdd === 1 ? '' : 's'}</button><button class="btn ghost" type="button" id="im-back">Back</button></div></div></div>`;
  const keep = () => { const sh = layer.querySelector('.sheet'); return sh ? sh.scrollTop : 0; };
  const redraw = () => { const y = keep(); drawImport(); const sh = layer.querySelector('.sheet'); if (sh) sh.scrollTop = y; };
  layer.querySelectorAll('[data-pick]').forEach(sl => sl.addEventListener('change', () => { imp.picks[sl.dataset.pick] = sl.value; redraw(); }));
  layer.querySelectorAll('[data-inc]').forEach(cb => cb.addEventListener('change', () => { imp.include[cb.dataset.inc] = cb.checked; redraw(); }));
  layer.querySelectorAll('[data-rem]').forEach(cb => cb.addEventListener('change', () => { const i = cb.dataset.rem; if (cb.checked) imp.remember[i] = layer.querySelector(`[data-kw="${i}"]`).value; else delete imp.remember[i]; }));
  layer.querySelectorAll('[data-kw]').forEach(inp => inp.addEventListener('input', () => { if (imp.remember[inp.dataset.kw] !== undefined) imp.remember[inp.dataset.kw] = inp.value; }));
  const colChange = () => {
    const g = id => { const el = $('#' + id); return el ? +el.value : -1; };
    imp.cols = { header: $('#ic-head').checked, date: g('ic-date'), desc: g('ic-desc'), amount: g('ic-amt'), debit: g('ic-deb'), credit: g('ic-cre') };
    if (imp.cols.amount < 0 && imp.cols.debit < 0) imp.cols.debit = Math.min(2, ncol - 1);
    imp.picks = {}; imp.include = {}; redraw();
  };
  layer.querySelectorAll('#ic-date,#ic-desc,#ic-amt,#ic-deb,#ic-cre,#ic-head').forEach(el => el.addEventListener('change', colChange));
  $('#im-back').addEventListener('click', () => { imp.step = 1; drawImport(); });
  $('#im-go').addEventListener('click', async () => {
    const go = $('#im-go'); go.disabled = true;
    const todo = preview.filter(p => included(p) && p.status !== 'Fix date / amount' && p.category);
    try {
      let n = 0;
      for (const p of todo) {
        go.textContent = `Adding ${++n} of ${todo.length}…`;
        await writeOp({ kind: 'tx-set', tx: { id: 't' + uid8(), date: p.date, description: p.description, category: p.category, amount: p.amount, paymentMethod: p.paymentMethod, essential: p.essential, notes: p.notes } });
      }
      const newRules = Object.entries(imp.remember).map(([i, kw]) => ({ keyword: String(kw).trim(), category: imp.picks[i] })).filter(r => r.keyword && r.category && !(state.merchantRules || []).some(x => x.keyword.toLowerCase() === r.keyword.toLowerCase()));
      if (newRules.length) { const cfg = JSON.parse(JSON.stringify(config())); cfg.merchantRules = [...newRules, ...(cfg.merchantRules || [])]; await writeOp({ kind: 'config', config: cfg }); Object.assign(state, cfg); cacheLocal(); }
      layer.innerHTML = ''; render();
      buzz('success'); showToast(`Added ${todo.length} transaction${todo.length === 1 ? '' : 's'}` + (newRules.length ? ` and ${newRules.length} merchant rule${newRules.length === 1 ? '' : 's'}` : ''));
    } catch (e) { go.disabled = false; go.textContent = 'Try again'; showToast('Some rows did not save. Check your connection and try again.'); }
  });
}

// ---------- quick add / edit ----------
function openTx(existing) {
  const editing = !!existing;
  const t = existing ? { ...existing } : { id: 't' + uid8(), date: todayISO(), amount: '', category: '', paymentMethod: pref.method || 'Credit Card', description: '', essential: false, notes: '' };
  let essentialTouched = editing;
  const cats = catsByUse();
  const top = cats.filter(c => c.n > 0 || state.categories.some(x => x.name === c.name)).slice(0, 8);
  if ((state.savingsAccounts || []).length && !top.some(c => c.name === 'Outside Savings')) { const os = cats.find(c => c.name === 'Outside Savings'); if (os) { if (top.length >= 8) top.pop(); top.push(os); } }
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="txform" role="dialog" aria-modal="true" aria-labelledby="tx-h" novalidate>
    <div class="grab"></div>
    <h3 id="tx-h">${editing ? 'Edit transaction' : 'Add a transaction'}</h3>
    <div class="amount-in"><span>${esc(sym())}</span><input id="tx-amount" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Amount" value="${t.amount !== '' ? Number(t.amount).toFixed(2) : ''}"></div>
    <div class="field"><span class="lbl">Category</span><div class="chips" id="tx-chips">${top.map(c => `<button type="button" data-cat="${esc(c.name)}" aria-pressed="${c.name === t.category}">${esc(catLabel(c.name))}</button>`).join('')}</div>
      <select class="in" id="tx-cat" aria-label="All categories"><option value="">${top.length ? 'More categories…' : 'Choose a category'}</option>${cats.map(c => `<option value="${esc(c.name)}"${c.name === t.category ? ' selected' : ''}>${esc(catLabel(c.name))}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Paid with</span><div class="seg" id="tx-m">${METHODS.map(m => `<button type="button" data-m="${m}" aria-pressed="${m === t.paymentMethod}">${METHOD_LABEL[m]}</button>`).join('')}</div></div>
    <div class="actions"><button class="btn primary" id="tx-save" type="submit">${editing ? 'Save changes' : 'Save'}</button></div>
    <div class="err" id="tx-err" hidden></div>
    <div class="two"><div class="field"><label for="tx-date">Date</label><input class="in" type="date" id="tx-date" value="${t.date}"></div>
      <div class="field"><span class="lbl">Essential?</span><label class="toggle" for="tx-ess"><span>Essential</span><input type="checkbox" id="tx-ess"${t.essential ? ' checked' : ''}></label></div></div>
    <div class="field"><label for="tx-desc">Description</label><input class="in" id="tx-desc" value="${esc(t.description)}" placeholder="Start typing for suggestions" autocomplete="off" list="tx-desc-list">
      <datalist id="tx-desc-list">${descSuggestions().map(x => `<option value="${esc(x)}"></option>`).join('')}</datalist></div>
    <div class="field"><label for="tx-notes">Notes</label><textarea class="in" id="tx-notes">${esc(t.notes)}</textarea></div>
    <div class="actions">${editing ? `<button class="btn" style="background:var(--surface);border:1px solid var(--line)" type="button" id="tx-repeat">Repeat monthly</button><button class="btn danger" type="button" id="tx-del">Delete transaction</button>` : ''}<button class="btn ghost" type="button" id="tx-cancel">Cancel</button></div>
  </form></div>`;
  const amt = $('#tx-amount');
  if (!editing) setTimeout(() => amt.focus(), 50);
  let dateTouched = false, autoPay = false;
  const setCat = name => {
    if (!editing && !dateTouched) {
      if (name === 'Net Pay' && payFundsNext()) {
        const pe = payEntryFor(todayISO()); $('#tx-date').value = pe.date; autoPay = true;
        if (!$('#tx-desc').value) $('#tx-desc').value = pe.description;
        if (!$('#tx-notes').value) $('#tx-notes').value = pe.notes;
        t.paymentMethod = 'Bank Transfer'; layer.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === 'Bank Transfer'));
        if (!$('#tx-amount').value) $('#tx-amount').value = (+state.settings.netPayPerPeriod || 0).toFixed(2);
      } else if (autoPay) { $('#tx-date').value = todayISO(); autoPay = false; }
    }
    if (!editing && name === 'Outside Savings') { t.paymentMethod = 'Bank Transfer'; layer.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === 'Bank Transfer')); if (!$('#tx-desc').value) $('#tx-desc').value = 'Transfer to ' + catLabel(name).replace('Savings → ', ''); }
    t.category = name;
    layer.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === name));
    $('#tx-cat').value = top.some(c => c.name === name) ? '' : name;
    if (!essentialTouched) { const c = allCategories().find(c => c.name === name); $('#tx-ess').checked = !!(c && c.essential); }
  };
  layer.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => setCat(b.dataset.cat)));
  $('#tx-cat').addEventListener('change', e => { if (e.target.value) setCat(e.target.value); });
  layer.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { t.paymentMethod = b.dataset.m; layer.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  $('#tx-ess').addEventListener('change', () => { essentialTouched = true; });
  $('#tx-date').addEventListener('input', () => { dateTouched = true; });
  // Picking a past description fills its category and payment method; otherwise a merchant rule may match.
  const desc = $('#tx-desc');
  const fromDesc = () => {
    if (t.category) return;
    const v = desc.value.trim().toLowerCase(); if (!v) return;
    const past = state.transactions.filter(x => String(x.description || '').toLowerCase() === v && x.category).sort((a, b) => a.date < b.date ? 1 : -1)[0];
    const cat = past ? past.category : E.matchRule(state.merchantRules, desc.value);
    if (cat) { setCat(cat); if (past && !editing) { t.paymentMethod = past.paymentMethod; layer.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === past.paymentMethod)); } }
  };
  desc.addEventListener('change', fromDesc);
  desc.addEventListener('input', () => { if (descSuggestions().some(x => x.toLowerCase() === desc.value.trim().toLowerCase())) fromDesc(); });
  const rep = $('#tx-repeat'); if (rep) rep.addEventListener('click', async () => {
    const day = +t.date.slice(8, 10);
    const ok = await saveConfig(cfg => { cfg.recurring = cfg.recurring || []; cfg.recurring.push({ id: 'r' + uid8(), description: t.description || t.category, category: t.category, amount: +t.amount, paymentMethod: t.paymentMethod, essential: !!t.essential, day, auto: false, lastMonth: E.monthKey(t.date) }); });
    if (ok) { close(); showToast('Repeats monthly on day ' + day + '. Manage it in Setup → Recurring.'); render(); }
  });
  const close = () => { layer.innerHTML = ''; };
  $('#tx-cancel').addEventListener('click', close);
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') close(); });
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
  const del = $('#tx-del');
  if (del) {
    let armed = false;
    del.addEventListener('click', async () => {
      if (!armed) { armed = true; del.textContent = 'Tap again to delete'; return; }
      del.disabled = true;
      const original = { ...existing };
      try { await writeOp({ kind: 'tx-del', id: t.id }); close(); buzz('tap'); refreshAfterWrite();
        showToast('Deleted ' + (original.description || original.category || 'transaction'), { label: 'Undo', fn: async () => { try { await writeOp({ kind: 'tx-set', tx: original }); buzz('success'); showToast('Restored'); refreshAfterWrite(); } catch (e) { showToast('Could not restore it. Add it again from +.'); } } }); }
      catch (e) { del.disabled = false; showErr('Could not delete. Check your connection and try again.'); }
    });
  }
  function showErr(m) { const el = $('#tx-err'); el.textContent = m; el.hidden = false; buzz('warn'); }
  $('#txform').addEventListener('submit', async e => {
    e.preventDefault();
    const raw = amt.value.replace(/[,\s]/g, '').replace(/^J?\$/, '');
    const a = Number(raw);
    if (!raw || !isFinite(a) || a <= 0) { showErr('Enter an amount above zero.'); amt.focus(); return; }
    if (!$('#tx-date').value) { showErr('Pick a date.'); return; }
    const rec = { id: t.id, date: $('#tx-date').value, amount: a, category: t.category, paymentMethod: t.paymentMethod,
      description: $('#tx-desc').value.trim(), essential: $('#tx-ess').checked, notes: $('#tx-notes').value.trim() };
    $('#tx-save').disabled = true;
    try {
      await writeOp({ kind: 'tx-set', tx: rec });
      pref.method = rec.paymentMethod; lsSet(LS_PREF, pref);
      close(); showToast(editing ? 'Saved' : 'Added ' + two(a) + (rec.category ? ' · ' + rec.category : '')); refreshAfterWrite();
      // A firmer buzz when a card purchase leaves the card at or past a warning level.
      let lvl = null; try { const cc = E.compute(state, todayISO()).card; lvl = cc && cc.level; } catch (x) {}
      buzz(rec.paymentMethod === 'Credit Card' && (lvl === 'amber' || lvl === 'red') ? 'warn' : 'success');
    } catch (err) { $('#tx-save').disabled = false; showErr('Could not save. Check your connection and try again.'); }
  });
}
function refreshAfterWrite() { if (mode !== 'cloud') { render(); } }
$('#fab').addEventListener('click', () => openTx(null));
